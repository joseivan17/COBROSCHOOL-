<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Proyectos HLS — Happy Learning School</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f9f9f7;
    --surface-1: #fcfcfb;
    --surface-2: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.18);
    --good: #0ca30c;
    --good-text: #006300;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --status-bg-good: #e6f6e6;
    --status-bg-warning: #fff4de;
    --status-bg-critical: #fbe6e6;
    --accent: #2a78d6;
    --shadow: 0 1px 2px rgba(11,11,11,0.06), 0 4px 16px rgba(11,11,11,0.06);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #0d0d0d;
    --surface-1: #1a1a19;
    --surface-2: #222221;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --good: #0ca30c;
    --good-text: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #e66767;
    --status-bg-good: #102a10;
    --status-bg-warning: #332405;
    --status-bg-critical: #331212;
    --accent: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font-family: inherit; }
  #app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 264px;
    flex-shrink: 0;
    background: var(--surface-1);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    padding: 20px 18px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #1baf7a);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 15px; flex-shrink:0;
  }
  .brand-text { line-height: 1.25; }
  .brand-text .name { font-weight: 700; font-size: 13.5px; }
  .brand-text .sub { font-size: 11.5px; color: var(--text-muted); }

  .nav-section { padding: 14px 10px 6px; }
  .nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); padding: 4px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; color: var(--text-secondary); font-weight: 500;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--border); }
  .nav-item.active { background: var(--surface-2); color: var(--text-primary); box-shadow: var(--shadow); }
  .nav-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .nav-item .semaphore { width: 7px; height: 7px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }
  .nav-icon { width:16px; text-align:center; flex-shrink:0; font-size: 13px; }

  .sidebar-footer { margin-top: auto; padding: 12px 14px 16px; border-top: 1px solid var(--border); }
  .theme-toggle {
    display:flex; align-items:center; gap:8px; width:100%;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-secondary); font-size: 12.5px; cursor:pointer;
  }
  .theme-toggle:hover { border-color: var(--border-strong); }
  .demo-note { font-size: 10.5px; color: var(--text-muted); margin-top: 10px; line-height: 1.4; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; background: var(--surface-0);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 19px; margin: 0; font-weight: 700; }
  .topbar .crumb { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .content { padding: 22px 28px 60px; max-width: 1280px; }

  /* ---------- Stat tiles ---------- */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .stat-tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .stat-tile .label { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px; }
  .stat-tile .value { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .stat-tile .delta { font-size: 12px; margin-top: 4px; color: var(--text-muted); }
  .stat-tile .delta.good { color: var(--good-text); }
  .stat-tile .delta.critical { color: var(--critical); }

  /* ---------- Cards / sections ---------- */
  .section { margin-bottom: 26px; }
  .section-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 12px; }
  .section-head h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .section-head .hint { font-size: 12px; color: var(--text-muted); }
  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }

  /* ---------- Department semaphore grid ---------- */
  .dept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .dept-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .08s ease;
  }
  .dept-card:hover { border-color: var(--border-strong); }
  .dept-card-top { display:flex; align-items:center; gap: 9px; margin-bottom: 8px; }
  .dept-color-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink:0; }
  .dept-card-name { font-size: 13px; font-weight: 700; line-height: 1.25; flex: 1; }
  .semaphore-pill { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dept-card .coord { font-size: 11.5px; color: var(--text-muted); margin-bottom: 10px; }
  .dept-card .pct-row { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
  .dept-card .pct { font-size: 20px; font-weight: 700; }
  .dept-card .pct-label { font-size: 10.5px; color: var(--text-muted); }
  .progress-track { height: 6px; border-radius: 4px; background: var(--gridline); overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; border-radius: 4px; }
  .dept-card .mini-stats { display:flex; gap: 10px; font-size: 11px; color: var(--text-secondary); }
  .dept-card .mini-stats b { color: var(--text-primary); }
  .confidential-badge { font-size: 10px; color: var(--text-muted); display:inline-flex; align-items:center; gap:3px; margin-left:6px; }

  /* ---------- Bar chart (comparativa) ---------- */
  .bar-chart { padding: 18px 20px 8px; }
  .bar-row { display: grid; grid-template-columns: 190px 1fr 46px; align-items: center; gap: 10px; padding: 7px 0; }
  .bar-row .name { font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 14px; background: var(--gridline); border-radius: 4px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; min-width: 3px; }
  .bar-row .val { font-size: 12px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- Overdue list ---------- */
  .task-list-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .task-list-table th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-muted); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--gridline);
  }
  .task-list-table td { padding: 10px 14px; border-bottom: 1px solid var(--gridline); vertical-align: middle; }
  .task-list-table tr:last-child td { border-bottom: none; }
  .task-list-table tr:hover td { background: var(--border); cursor: pointer; }
  .badge { display: inline-flex; align-items:center; gap:5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space:nowrap; }
  .badge-dot { width:6px; height:6px; border-radius:50%; }
  .badge.status-atrasado { background: var(--status-bg-critical); color: var(--critical); }
  .badge.status-completado { background: var(--status-bg-good); color: var(--good-text); }
  .badge.status-pendiente { background: var(--gridline); color: var(--text-secondary); }
  .badge.status-progreso { background: #e5eefb; color: var(--accent); }
  [data-theme="dark"] .badge.status-progreso { background: #12233a; }
  .badge.status-revision { background: #efeafc; color: #6a55c9; }
  [data-theme="dark"] .badge.status-revision { background: #241c3f; }
  .badge.priority-alta { color: var(--critical); }
  .badge.priority-media { color: #a67405; }
  [data-theme="dark"] .badge.priority-media { color: var(--warning); }
  .badge.priority-baja { color: var(--text-muted); }
  .empty-state { padding: 32px 20px; text-align:center; color: var(--text-muted); font-size: 13px; }

  /* ---------- Department detail ---------- */
  .dept-banner {
    border-radius: 12px; padding: 18px 22px; margin-bottom: 20px; color: #fff;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .dept-banner .titles h2 { margin:0 0 4px; font-size: 19px; }
  .dept-banner .titles .coord { font-size: 12.5px; opacity: .9; }
  .dept-banner .kpis { display:flex; gap: 22px; }
  .dept-banner .kpis .k { text-align:right; }
  .dept-banner .kpis .k .v { font-size: 20px; font-weight: 700; }
  .dept-banner .kpis .k .l { font-size: 10.5px; opacity: .85; }
  .confidential-note {
    background: var(--status-bg-warning); border: 1px solid var(--warning); color: var(--text-primary);
    border-radius: 10px; padding: 10px 14px; font-size: 12px; margin-bottom: 18px;
  }

  .toolbar { display:flex; align-items:center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  select, .btn {
    font-size: 12.5px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--surface-2); color: var(--text-primary); cursor:pointer;
  }
  .btn { display:inline-flex; align-items:center; gap:6px; font-weight:600; }
  .btn:hover { border-color: var(--text-muted); }
  .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .view-tabs { display:flex; gap: 4px; background: var(--gridline); padding: 3px; border-radius: 9px; }
  .view-tabs button { border: none; background: none; padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
  .view-tabs button.active { background: var(--surface-2); color: var(--text-primary); box-shadow: var(--shadow); }

  /* Kanban */
  .kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; }
  .kanban-col { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; min-height: 160px; display:flex; flex-direction:column; }
  .kanban-col-head { padding: 11px 12px 9px; font-size: 12px; font-weight: 700; display:flex; align-items:center; justify-content:space-between; border-bottom: 1px solid var(--border); }
  .kanban-col-head .count { font-size: 11px; color: var(--text-muted); font-weight: 600; background: var(--gridline); padding: 1px 7px; border-radius: 999px; }
  .kanban-col-body { padding: 9px; display:flex; flex-direction:column; gap: 8px; flex:1; min-height: 60px; }
  .kanban-col-body.drag-over { background: var(--border); }
  .task-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px;
    cursor: grab; box-shadow: var(--shadow); font-size: 12px;
  }
  .task-card:active { cursor: grabbing; }
  .task-card .t-title { font-weight: 600; font-size: 12.5px; margin-bottom: 6px; line-height:1.3; }
  .task-card .t-meta { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .task-card .t-resp { font-size: 11px; color: var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task-card .t-due { font-size: 10.5px; color: var(--text-muted); margin-top:5px; }
  .task-card .t-due.overdue { color: var(--critical); font-weight:600; }

  /* Checklists */
  .checklist-card { padding: 16px 18px; margin-bottom: 12px; }
  .checklist-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .checklist-head .title { font-weight: 700; font-size: 13px; }
  .checklist-head .pct { font-size: 13px; font-weight: 700; }
  .checklist-item { display:flex; align-items:center; gap: 10px; padding: 6px 0; font-size: 12.5px; border-bottom: 1px solid var(--gridline); }
  .checklist-item:last-child { border-bottom: none; }
  .checklist-item input { width: 16px; height: 16px; accent-color: var(--good); cursor:pointer; }
  .checklist-item.done label { text-decoration: line-through; color: var(--text-muted); }
  .checklist-item label { flex:1; cursor:pointer; }

  /* Calendar */
  .cal-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { font-size: 10.5px; font-weight:700; text-transform:uppercase; color: var(--text-muted); text-align:center; padding: 4px 0 8px; }
  .cal-day {
    min-height: 84px; border: 1px solid var(--border); border-radius: 9px; padding: 6px; background: var(--surface-1);
    font-size: 11px; cursor: pointer; display:flex; flex-direction:column; gap:3px;
  }
  .cal-day.other-month { opacity: .35; }
  .cal-day.today { border-color: var(--accent); border-width: 2px; }
  .cal-day.selected { background: var(--border); }
  .cal-day .num { font-weight: 700; font-size: 11.5px; }
  .cal-dot-row { display:flex; flex-wrap:wrap; gap:3px; }
  .cal-dot { width:6px; height:6px; border-radius:50%; }
  .cal-day .more { font-size: 9.5px; color: var(--text-muted); }
  .cal-nav { display:flex; align-items:center; gap: 10px; margin-bottom: 14px; }
  .cal-nav .label { font-weight:700; font-size: 14px; min-width: 160px; text-align:center; text-transform:capitalize; }
  .day-detail { margin-top: 16px; }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }

  /* ---------- usuarios / modal / mis tareas ---------- */
  .role-banner { font-size: 11.5px; color: var(--text-muted); padding: 8px 10px; background: var(--border); border-radius: 8px; margin-bottom: 12px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-panel { background: var(--surface-1); border-radius: 14px; max-width: 560px; width: 100%; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top:0; background: var(--surface-1); }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-close { border: none; background: none; font-size: 20px; line-height:1; cursor: pointer; color: var(--text-muted); padding: 2px 6px; border-radius: 6px; }
  .modal-close:hover { background: var(--border); }
  .modal-body { padding: 18px 20px 22px; }
  .modal-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 16px; font-size: 12px; color: var(--text-secondary); }
  .modal-meta b { color: var(--text-primary); }
  .modal-subtitle { font-size: 12px; font-weight: 700; margin: 14px 0 8px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; }
  .attachment-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .attachment-chip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; font-size: 12px; background: var(--surface-2); }
  .attachment-chip a { flex: 1; text-decoration: none; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attachment-chip .remove { border: none; background: none; color: var(--text-muted); cursor: pointer; font-size: 13px; flex-shrink:0; }
  .att-pdf { color: var(--critical); } .att-word { color: #2a78d6; } .att-excel { color: var(--good); } .att-ppt { color: #eb6834; } .att-image { color: #4a3aa7; } .att-link { color: var(--text-muted); }

  /* ---------- Personas asignadas (multi-responsable) ---------- */
  .assignee-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .assignee-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); font-size: 12px; }
  .assignee-chip .avatar { width: 20px; height: 20px; border-radius: 50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:9.5px; font-weight:700; flex-shrink:0; }
  .assignee-chip .name { white-space: nowrap; }
  .assignee-chip .deliver-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--status-bg-warning); color: var(--warning); white-space: nowrap; }
  .assignee-chip .deliver-badge.completado { background: var(--status-bg-good); color: var(--good-text); }
  .assignee-chip .unassign { border:none; background:none; color: var(--text-muted); cursor:pointer; padding:0; display:flex; }
  .assignee-picker { border: 1px solid var(--border-strong); }

  /* ---------- Selección múltiple y barra de acciones en bloque ---------- */
  .row-select-cell { width: 30px; text-align:center; }
  .bulk-toolbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 60;
    background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 12px;
    box-shadow: var(--shadow); padding: 8px 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    max-width: calc(100vw - 40px);
  }
  .bulk-toolbar .count { font-size: 12.5px; font-weight: 700; padding: 0 8px 0 4px; white-space: nowrap; }
  .bulk-toolbar .btn { padding: 7px 11px; font-size: 12.5px; }
  .bulk-menu-panel {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 74px; z-index: 61;
    background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 12px;
    box-shadow: var(--shadow); padding: 12px; min-width: 260px; max-width: calc(100vw - 40px);
  }
  .attach-form { display: flex; gap: 8px; margin-bottom: 8px; }
  .attach-form input[type=text] { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-size: 12px; }
  .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .card-attach-btn { margin-top: 6px; font-size: 10.5px; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; font-weight:600; }
  .file-label { display:inline-flex; align-items:center; gap:6px; }
  .user-row-avatar { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; margin-right: 8px; flex-shrink:0; }
  .invite-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
  .invite-form .field { display: flex; flex-direction: column; gap: 4px; }
  .invite-form .field label { font-size: 10.5px; color: var(--text-muted); }
  .invite-form input[type=email] { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-size: 12.5px; min-width: 230px; }
  .invite-link-banner { background: var(--status-bg-good); border: 1px solid var(--good); border-radius: 9px; padding: 10px 14px; font-size: 12px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
  .invite-link-banner code { font-size: 11.5px; }
  .invite-error { color: var(--critical); font-size: 12px; margin-bottom: 10px; }
  .badge.status-activo { background: var(--status-bg-good); color: var(--good-text); }
  .badge.status-invitado { background: var(--status-bg-warning); color: #a67405; }
  [data-theme="dark"] .badge.status-invitado { color: var(--warning); }
  .checklist-add-row { display: flex; gap: 8px; margin-top: 10px; }
  .checklist-add-row input { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-size: 12.5px; }
  .login-screen { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--surface-2); padding: 20px; box-sizing: border-box; }
  .login-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 32px 30px; width: 100%; max-width: 380px; }
  .login-card .field { display: flex; flex-direction: column; gap: 5px; }
  .login-card .field label { font-size: 11px; color: var(--text-muted); }
  .login-card input[type=email], .login-card .pw-wrap input { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-size: 13px; width: 100%; }
  .pw-wrap { position: relative; display: block; width: 100%; }
  .pw-wrap input { padding-right: 40px !important; box-sizing: border-box; }
  .pw-toggle { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); border: none; background: none; color: var(--text-muted); cursor: pointer; padding: 5px 6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
  .pw-toggle:hover { color: var(--text-primary); background: var(--surface-3, rgba(128,128,128,.12)); }
  .pw-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search-box { position: relative; display: inline-flex; align-items: center; }
  .search-box > svg.icon { position: absolute; left: 9px; color: var(--text-muted); pointer-events: none; }
  .search-box input { padding: 7px 28px 7px 28px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-size: 12.5px; min-width: 220px; box-sizing: border-box; }
  .search-box.block { display: flex; width: 100%; margin-bottom: 10px; }
  .search-box.block input { width: 100%; }
  .search-box .search-clear { position: absolute; right: 5px; border: none; background: none; color: var(--text-muted); cursor: pointer; padding: 3px; border-radius: 6px; display: inline-flex; }
  .search-box .search-clear:hover { color: var(--text-primary); }
  .search-meta { font-size: 11.5px; color: var(--text-muted); margin: -4px 0 8px; }
  .checklist-item .item-btn { border: none; background: none; color: var(--text-muted); cursor: pointer; padding: 3px; border-radius: 6px; display: inline-flex; }
  .checklist-item .item-btn:hover { color: var(--text-primary); }
  .checklist-edit-row { display: flex; gap: 6px; align-items: center; flex: 1; }
  .checklist-edit-row input { flex: 1; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--accent); background: var(--surface-2); color: var(--text-primary); font-size: 12.5px; }
  .badge.status-inactivo { background: var(--status-bg-warning); color: #a67405; }

  @media (max-width: 900px) {
    .stat-row { grid-template-columns: repeat(2,1fr); }
    .kanban { grid-template-columns: 1fr; }
    #app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; }
  }
</style>
</head>

<div id="app"></div>

/* =========================================================
   ICONOS (SVG en línea — reemplaza los emojis por un set
   consistente, monocromo, estilo trazo)
   ========================================================= */
/* =========================================================
   CLIENTE SUPABASE (autenticación real — fase A de integración)
   ========================================================= */
let _supabaseClient = null;
let _supabaseClientKey = null;
function getSupabaseClient(){
  const url = state.supabase.url, key = state.supabase.anonKey;
  if (!url || !key) return null;
  const cacheKey = url + '|' + key;
  if (_supabaseClient && _supabaseClientKey === cacheKey) return _supabaseClient;
  // persistSession:false a propósito — no usamos localStorage/sessionStorage en esta vista;
  // por diseño, la sesión no sobrevive a un recargo de página (ya se le avisa al usuario en el login).
  _supabaseClient = window.supabase.createClient(url, key, { auth: { persistSession:false, autoRefreshToken:false } });
  _supabaseClientKey = cacheKey;
  return _supabaseClient;
}
function friendlySupabaseError(err){
  const msg = (err && err.message) || String(err);
  if (/invalid login credentials/i.test(msg)) return 'Correo o contraseña incorrectos.';
  if (/email not confirmed/i.test(msg)) return 'Este correo todavía no confirma su cuenta (revisa la bandeja de entrada o confírmalo desde Supabase → Authentication → Users).';
  if (/user already registered/i.test(msg)) return 'Ya existe una cuenta con ese correo — intenta iniciar sesión en vez de crear una cuenta nueva.';
  if (/password should be at least/i.test(msg)) return 'La contraseña es demasiado corta para Supabase (revisa el mínimo configurado en Authentication → Providers).';
  if (/duplicate key value violates unique constraint/i.test(msg) && /invites/i.test(msg)) return 'Ya existe una invitación pendiente con ese correo.';
  return msg + ' (mensaje técnico de Supabase — cópialo si necesitas reportarlo)';
}

/* =========================================================
   FUNCIÓN EDGE "admin-users" — crear/invitar/eliminar cuentas
   con cualquier rol. Esto necesita la service role key de Supabase,
   que NUNCA vive en este HTML: en su lugar, esta llamada va a una
   función Edge que corre del lado del servidor (ver SUPABASE_SETUP.md,
   Parte 4) y ahí sí puede usar esa clave de forma segura.
   ========================================================= */
async function callAdminUsersFunction(action, payload){
  const client = getSupabaseClient();
  if (!client) throw new Error('No hay una conexión a Supabase configurada.');
  let session = null;
  try {
    const { data } = await client.auth.getSession();
    session = data && data.session;
  } catch (e) { session = null; }
  if (!session || !session.access_token) throw new Error('Tu sesión expiró — vuelve a iniciar sesión e intenta de nuevo.');
  const endpoint = state.supabase.url.replace(/\/$/, '') + '/functions/v1/admin-users';
  let resp;
  try {
    resp = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token,
        'apikey': state.supabase.anonKey,
      },
      body: JSON.stringify({ action, ...payload }),
    });
  } catch (networkErr) {
    throw new Error('No se pudo contactar la función "admin-users" — revisa que esté desplegada en tu proyecto de Supabase (ver SUPABASE_SETUP.md, Parte 4) y que tengas conexión a internet.');
  }
  if (resp.status === 404) {
    throw new Error('La función "admin-users" todavía no está desplegada en tu proyecto de Supabase (ver SUPABASE_SETUP.md, Parte 4).');
  }
  let body = null;
  try { body = await resp.json(); } catch (e) { /* respuesta vacía o no-JSON */ }
  if (!resp.ok) throw new Error((body && body.error) || `La función devolvió un error (código ${resp.status}).`);
  if (body && body.error) throw new Error(body.error);
  return body;
}

   ========================================================= */
function isRealSession(){ return state.realSession === true && !!getSupabaseClient(); }

// Fusiona perfiles reales de Supabase en el arreglo local USERS (mismo formato que
// usa toda la app de demostración), para que assignableUsers()/usersInDept()/etc.
// — usadas por el tablero de tareas, el modal de tarea, el calendario, etc. —
// funcionen igual con datos reales sin tener que reescribir esas funciones.
function mergeRealUsersIntoLocalArray(profiles){
  // Elimina cualquier usuario de demostración (Miguel Torres, Laura Fernández, etc.)
  // que haya quedado en el arreglo local — en sesión real, USERS solo debe contener
  // personal de verdad (marcado con _remote:true al fusionarse aquí o en el login).
  for (let i = USERS.length - 1; i >= 0; i--){ if (!USERS[i]._remote) USERS.splice(i,1); }
  (profiles||[]).forEach(p=>{
    const mapped = { id:p.id, name:p.name, email:p.email, deptId:p.dept_id, role:p.role, cargo:p.cargo, status:p.status, lastReviewOffset:null, _remote:true };
    // Empareja por id (ya fusionado antes) o por correo (mismo correo que un usuario semilla
    // de demostración, como hace el login real) para no duplicar filas en los menús.
    const idx = USERS.findIndex(u=>u.id===p.id || u.email.toLowerCase()===p.email.toLowerCase());
    if (idx>-1) USERS[idx] = mapped; else USERS.push(mapped);
  });
}

async function loadRemoteUsersModule(){
  const client = getSupabaseClient();
  if (!client) return;
  state.remote.loading = true; state.remote.error = null; render();
  try {
    const results = await Promise.all([
      client.from('profiles').select('*').order('name'),
      isLeadership() ? client.from('invites').select('*').eq('status','pendiente').order('created_at',{ascending:false}) : Promise.resolve({data:[],error:null}),
      isLeadership() ? client.from('audit_log').select('*, actor:profiles!audit_log_actor_id_fkey(name)').order('created_at',{ascending:false}).limit(50) : Promise.resolve({data:[],error:null}),
    ]);
    const [usersRes, invitesRes, auditRes] = results;
    if (usersRes.error) throw usersRes.error;
    if (invitesRes.error) throw invitesRes.error;
    if (auditRes.error) throw auditRes.error;
    state.remote.users = usersRes.data || [];
    state.remote.invites = invitesRes.data || [];
    state.remote.auditLog = auditRes.data || [];
    mergeRealUsersIntoLocalArray(state.remote.users);
    state.remote.loading = false;
    render();
  } catch (err) {
    state.remote.loading = false;
    state.remote.error = friendlySupabaseError(err);
    render();
  }
}

/* =========================================================
   MÓDULOS "TABLERO DE TAREAS" Y "CHECKLISTS" — CONECTADOS A SUPABASE
   =========================================================
   Estrategia: en vez de reescribir cada pantalla (Kanban, lista, modal de
   tarea, calendario, Mis tareas, dashboard), esta carga puebla los MISMOS
   arreglos globales que usa el modo de demostración (TASKS, TASK_NOTES,
   TASK_ATTACHMENTS, CHECKLISTS[deptId].items, PERSONAL_CHECKLISTS[userId])
   con datos reales de Supabase, adaptados exactamente a la misma forma que
   ya esperan esas pantallas. Así, toda esa lógica de render sigue
   funcionando sin cambios, tanto en modo demo como en modo real.
   ========================================================= */
async function loadRemoteTasksModule(){
  const client = getSupabaseClient();
  if (!client) return;
  state.remoteTasks.loading = true; state.remoteTasks.error = null; render();
  try {
    // Asegura que USERS tenga a todo el personal real (no solo a quien inició sesión),
    // para que los menús de "Responsable" muestren a los compañeros de verdad.
    if (!state.remote.users) await loadRemoteUsersModule();

    const results = await Promise.all([
      client.from('tasks').select('*, resp:profiles!tasks_resp_user_id_fkey(id,name,cargo), assignedByProfile:profiles!tasks_assigned_by_user_id_fkey(name)').order('due_date'),
      client.from('task_notes').select('*, authorProfile:profiles!task_notes_author_id_fkey(name)').order('created_at'),
      client.from('task_attachments').select('*').order('created_at'),
      client.from('dept_checklist_items').select('*').order('position'),
      client.from('personal_checklist_items').select('*').eq('user_id', currentUser().id).order('position'),
      // Responsables múltiples por tarea (con entrega individual) — sin esto, al recargar
      // los datos la tarea "olvida" a todos menos al responsable principal.
      client.from('task_assignees').select('*').order('assigned_at'),
    ]);
    const [tasksRes, notesRes, attsRes, deptClRes, personalClRes, assigneesRes] = results;
    if (tasksRes.error) throw tasksRes.error;
    if (notesRes.error) throw notesRes.error;
    if (attsRes.error) throw attsRes.error;
    if (deptClRes.error) throw deptClRes.error;
    if (personalClRes.error) throw personalClRes.error;
    if (assigneesRes.error) throw assigneesRes.error;

    const todayD = today();
    const dayMs = 24*60*60*1000;

    // ---- Tareas: mismo shape que TASKS de demostración ----
    TASKS.length = 0;
    (tasksRes.data||[]).forEach(row=>{
      TASKS.push({
        id: row.id, deptId: row.dept_id, title: row.title, priority: row.priority, status: row.status,
        dueOffset: 0, dueDateFixed: row.due_date,
        resp: row.resp ? row.resp.name : '—', cargo: row.resp ? (row.resp.cargo||null) : null,
        assignedBy: row.assignedByProfile ? row.assignedByProfile.name : null,
        _respUserId: row.resp_user_id, _assignedByUserId: row.assigned_by_user_id, _remote: true,
      });
    });

    // ---- Responsables múltiples: arma task.assignees a partir de task_assignees ----
    // (puede incluir personas de OTROS departamentos — un asignado no tiene por qué
    // pertenecer al mismo departamento que la tarea, ej. liderazgo o coordinación).
    const assigneesByTask = {};
    (assigneesRes.data||[]).forEach(row=>{
      (assigneesByTask[row.task_id] = assigneesByTask[row.task_id] || []).push(row);
    });
    TASKS.forEach(t=>{
      const rows = assigneesByTask[t.id] || [];
      if (rows.length){
        const list = rows.map(row=>{
          const u = USERS.find(x=>x.id===row.user_id);
          return { userId: row.user_id, name: u ? u.name : '(usuario eliminado)', cargo: u ? (u.cargo||null) : null, status: row.status };
        });
        // El responsable principal (resp_user_id) va primero, para que las vistas que
        // solo muestran "el primero" (resumen, tarjetas) sigan mostrando a quien corresponde.
        list.sort((a,b)=>{
          if (a.userId===t._respUserId) return -1;
          if (b.userId===t._respUserId) return 1;
          return 0;
        });
        t.assignees = list;
      } else if (t._respUserId) {
        // Tarea antigua sin filas en task_assignees todavía: usa el responsable principal.
        t.assignees = [{ userId: t._respUserId, name: t.resp, cargo: t.cargo, status: t.status==='completado' ? 'completado' : 'pendiente' }];
      } else {
        t.assignees = [];
      }
    });

    // ---- Notas: mismo shape que TASK_NOTES, con "offset" calculado desde created_at ----
    Object.keys(TASK_NOTES).forEach(k=>delete TASK_NOTES[k]);
    (notesRes.data||[]).forEach(row=>{
      const offset = Math.round((new Date(row.created_at) - todayD) / dayMs);
      (TASK_NOTES[row.task_id] = TASK_NOTES[row.task_id] || []).push({
        author: row.authorProfile ? row.authorProfile.name : '—', offset, text: row.text, _id: row.id, _remote: true,
      });
    });

    // ---- Adjuntos: mismo shape que TASK_ATTACHMENTS ----
    // Los archivos reales (storage_path presente) viven en un bucket privado de Supabase
    // Storage — se firma una URL temporal (6h) para poder mostrarlos/descargarlos.
    // Los adjuntos por enlace externo (Drive, OneDrive, etc.) no tienen storage_path y
    // conservan su "url" tal cual.
    Object.keys(TASK_ATTACHMENTS).forEach(k=>delete TASK_ATTACHMENTS[k]);
    const attsData = attsRes.data || [];
    const storagePaths = attsData.filter(r=>r.storage_path).map(r=>r.storage_path);
    let signedMap = {};
    if (storagePaths.length){
      try {
        const { data: signedList, error: signErr } = await client.storage.from('task-attachments').createSignedUrls(storagePaths, 60*60*6);
        if (!signErr && signedList) signedList.forEach(s=>{ if (s.signedUrl) signedMap[s.path] = s.signedUrl; });
      } catch (e) { /* si falla la firma, se usa la última url guardada como respaldo (puede estar vencida) */ }
    }
    attsData.forEach(row=>{
      const url = row.storage_path ? (signedMap[row.storage_path] || row.url) : row.url;
      (TASK_ATTACHMENTS[row.task_id] = TASK_ATTACHMENTS[row.task_id] || []).push({
        type: row.type, name: row.name, url, _id: row.id, _storagePath: row.storage_path, _remote: true,
      });
    });

    // ---- Checklist de departamento: conserva el título de demostración, reemplaza items ----
    const deptClByDept = {};
    (deptClRes.data||[]).forEach(row=>{
      (deptClByDept[row.dept_id] = deptClByDept[row.dept_id] || []).push({ t: row.text, done: row.done, _id: row.id });
    });
    Object.keys(CHECKLISTS).forEach(deptId=>{
      CHECKLISTS[deptId].items = deptClByDept[deptId] || [];
    });

    // ---- Checklist personal (solo la propia, por RLS) ----
    PERSONAL_CHECKLISTS[currentUser().id] = (personalClRes.data||[]).map(row=>({ t: row.text, done: row.done, _id: row.id }));

    state.remoteTasks.loading = false;
    state.remoteTasks.loaded = true;
    render();
  } catch (err) {
    state.remoteTasks.loading = false;
    state.remoteTasks.error = friendlySupabaseError(err);
    render();
  }
}

}

/* =========================================================
   RESPONSABLES MÚLTIPLES POR TAREA (con entrega individual)
   ---------------------------------------------------------
   Cada tarea guarda "resp"/"cargo" (responsable principal, tal como antes,
   para no romper ninguna vista que ya lo usaba), y además un arreglo
   "assignees" con TODAS las personas asignadas. Cada persona en ese arreglo
   tiene su propio "status" de entrega ('pendiente' | 'completado'),
   independiente del estado general de la tarea — así cada quien puede
   marcar su parte como entregada sin afectar a los demás asignados.
   ========================================================= */
function findUserByName(name){ return USERS.find(u=>u.name===name) || null; }
TASKS.forEach(t=>{
  const names = [t.resp, ...(t._coAssignees||[])].filter(Boolean);
  const seen = new Set();
  t.assignees = names.filter(n=>{ if (seen.has(n)) return false; seen.add(n); return true; }).map(name=>{
    const u = findUserByName(name);
    return {
      userId: u ? u.id : null,
      name,
      cargo: (name===t.resp ? t.cargo : (u ? u.cargo : null)) || null,
      status: t.status==='completado' ? 'completado' : 'pendiente',
    };
  });
  delete t._coAssignees;
  t.notify = false; // "Enviar notificaciones" — informativo, se guarda por tarea
});

function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(date, n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function dueDate(task){ return task.dueDateFixed ? new Date(task.dueDateFixed+'T00:00:00') : addDays(today(), task.dueOffset); }
function toISODate(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fmtDate(d){ return d.toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' }); }
function fmtDateShort(d){ return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' }); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isOverdue(task){ return task.status!=='completado' && (task.status==='atrasado' || dueDate(task) < today()); }
function dept(id){ return DEPARTMENTS.find(d=>d.id===id); }
function deptColor(d){ return document.documentElement.getAttribute('data-theme')==='dark' && d.colorDark ? d.colorDark : d.color; }

function currentUser(){ return USERS.find(u=>u.id===state.currentUserId) || USERS[0]; }
function isLeadership(){ const r = currentUser().role; return r==='directora' || r==='gerente'; }
function leadershipUsers(){ return USERS.filter(u=>u.role==='directora'||u.role==='gerente'); }
function visibleDepartments(){ const u=currentUser(); return isLeadership() ? DEPARTMENTS : DEPARTMENTS.filter(d=>d.id===u.deptId); }
function canSeeDept(deptId){ return isLeadership() || currentUser().deptId===deptId; }
function userInitials(name){ return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function userAvatarColor(user){ const d = dept(user.deptId); return d ? d.color : '#52514e'; }
function usersInDept(deptId){ return USERS.filter(u=>u.deptId===deptId); }
function assignableUsers(deptId){
  const seen = new Set();
  // Dirección/Gerencia coordinan entre departamentos, así que como admin pueden asignar
  // a cualquier persona de la escuela (por ejemplo, un/a coordinador/a de otro departamento
  // apoyando una tarea de Coordinación) — no solo a quienes ya pertenecen a este departamento.
  // El resto del personal (coordinador/colaborador) sigue viendo solo su propio departamento
  // más Dirección/Gerencia, como antes.
  const pool = isLeadership() ? USERS : [...usersInDept(deptId), ...leadershipUsers()];
  return pool.filter(u=>{ if (seen.has(u.id) || u.status==='inactivo') return false; seen.add(u.id); return true; });
}

   ========================================================= */
function taskAssigneeList(t){
  if (t.assignees && t.assignees.length) return t.assignees;
  if (!t.resp || t.resp==='—') return [];
  return [{ userId: t._respUserId || null, name: t.resp, cargo: t.cargo || null, status: t.status==='completado' ? 'completado' : 'pendiente' }];
}
function taskAssigneeSummary(t){
  const list = taskAssigneeList(t);
  if (list.length===0) return '—';
  if (list.length===1) return list[0].name + (list[0].cargo ? ` (${list[0].cargo})` : '');
  return `${list[0].name} +${list.length-1}`;
}
function myAssigneeEntry(t){
  const u = currentUser();
  return taskAssigneeList(t).find(a => (a.userId && a.userId===u.id) || a.name===u.name) || null;
}
function isTaskMine(t){ return !!myAssigneeEntry(t); }
function canToggleAssigneeDelivery(t, userIdOrName){
  const u = currentUser();
  if (isLeadership()) return true;
  if (u.deptId && u.deptId===t.deptId && u.role==='coordinador') return true;
  return (u.id===userIdOrName) || (u.name===userIdOrName);
}
// "Asignar con IA": sugerencia automática de balanceo de carga — NO es una llamada a un
// modelo de lenguaje externo; simplemente prioriza a quien tiene menos tareas abiertas
// en el departamento. Se etiqueta así en la interfaz para no generar expectativas falsas.
function suggestAssigneesAI(deptId, priority){
  const pool = assignableUsers(deptId).filter(u=>u.role==='coordinador' || u.role==='colaborador');
  const candidates = pool.length ? pool : assignableUsers(deptId);
  const withLoad = candidates.map(u=>{
    const open = TASKS.filter(t => t.deptId===deptId && t.status!=='completado' && taskAssigneeList(t).some(a=>a.userId===u.id)).length;
    return { u, open };
  }).sort((a,b)=>a.open-b.open);
  const n = priority==='alta' ? Math.min(2, withLoad.length) : Math.min(1, withLoad.length);
  return withLoad.slice(0,n).map(x=>x.u.id);
}
async function applyAssigneesToTask(task, newUserIds){
  const oldIds = new Set(taskAssigneeList(task).map(a=>a.userId).filter(Boolean));
  const newIds = [...new Set(newUserIds)];
  const newIdSet = new Set(newIds);
  if (isRealSession()){
    const client = getSupabaseClient();
    const toRemove = [...oldIds].filter(id=>!newIdSet.has(id));
    const toAdd = newIds.filter(id=>!oldIds.has(id));
    try {
      if (toRemove.length) { const { error } = await client.from('task_assignees').delete().eq('task_id', task.id).in('user_id', toRemove); if (error) throw error; }
      if (toAdd.length) { const { error } = await client.from('task_assignees').insert(toAdd.map(uid=>({ task_id: task.id, user_id: uid }))); if (error) throw error; }
      if (newIds.length) { await client.from('tasks').update({ resp_user_id: newIds[0], updated_at: new Date().toISOString() }).eq('id', task.id); }
    } catch (err) { state.taskError = friendlySupabaseError(err); render(); return false; }
  }
  const prevList = taskAssigneeList(task);
  task.assignees = newIds.map(uid=>{
    const existing = prevList.find(a=>a.userId===uid);
    const u = USERS.find(x=>x.id===uid);
    return { userId: uid, name: u ? u.name : '—', cargo: u ? (u.cargo||null) : null, status: existing ? existing.status : 'pendiente' };
  });
  if (task.assignees.length){ task.resp = task.assignees[0].name; task.cargo = task.assignees[0].cargo; task._respUserId = task.assignees[0].userId; }
  else { task.resp = '—'; task.cargo = null; task._respUserId = null; }
  return true;
}
async function setAssigneeStatus(task, userId, newStatus){
  const list = taskAssigneeList(task);
  if (!task.assignees || !task.assignees.length) task.assignees = list;
  const a = task.assignees.find(x => (x.userId && x.userId===userId) || (!x.userId && x.name===userId));
  if (!a) return;
  if (isRealSession() && a.userId){
    const client = getSupabaseClient();
    try {
      const { error } = await client.from('task_assignees').update({ status: newStatus, completed_at: newStatus==='completado' ? new Date().toISOString() : null }).eq('task_id', task.id).eq('user_id', a.userId);
      if (error) throw error;
    } catch (err) { state.taskError = friendlySupabaseError(err); render(); return; }
  }
  a.status = newStatus;
  render();
}
async function applyBulkAssignees(taskIds, userIds){
  for (const id of taskIds){

    if (task) await applyAssigneesToTask(task, userIds);

  render();
}

async function deleteBulkTasks(taskIds){

/* =========================================================
   PLANTILLAS DE TAREAS — importar / exportar como Excel (.xlsx)
   ---------------------------------------------------------
   Usa SheetJS (inlineado al inicio del archivo) para generar y leer
   archivos .xlsx reales — se pueden abrir, editar y volver a subir desde
   Excel, Google Sheets, Numbers, LibreOffice, etc. Una fila = una tarea.
   ========================================================= */
const TEMPLATE_HEADERS = ['Título','Responsables','Prioridad','Estado','Fecha límite','Nota'];

function buildTemplateRows(taskList){
  return taskList.map(t=>({
    'Título': t.title,
    'Responsables': taskAssigneeList(t).map(a=> a.cargo ? `${a.name} (${a.cargo})` : a.name).join('; '),
    'Prioridad': PRIORITY_LABELS[t.priority] || t.priority,
    'Estado': STATUS_LABELS[t.status] || t.status,
    'Fecha límite': toISODate(dueDate(t)),
    'Nota': (TASK_NOTES[t.id]||[])[0] ? TASK_NOTES[t.id][0].text : '',
  }));
}
function downloadTasksAsXlsx(deptId, taskList, filename){
  const d = dept(deptId);
  const rows = buildTemplateRows(taskList);
  const ws = XLSX.utils.json_to_sheet(rows, { header: TEMPLATE_HEADERS });
  ws['!cols'] = [{wch:38},{wch:32},{wch:10},{wch:14},{wch:13},{wch:44}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tareas');
  const buf = XLSX.write(wb, { type:'array', bookType:'xlsx' });
  const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---- Lectura tolerante del .xlsx al importar: acepta encabezados sin
//      tildes, en minúsculas, o con nombres ligeramente distintos ----
function normalizeHeaderText(h){
  return String(h||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}
function getTemplateCell(row, aliases){
  for (const k of Object.keys(row)){
    if (aliases.includes(normalizeHeaderText(k))) return row[k];
  }
  return '';
}
function parseTemplatePriority(val){
  const v = normalizeHeaderText(val);
  if (['alta','media','baja'].includes(v)) return v;
  const found = Object.keys(PRIORITY_LABELS).find(k=>normalizeHeaderText(PRIORITY_LABELS[k])===v);
  return found || 'media';
}
function parseTemplateStatus(val){
  const v = normalizeHeaderText(val);
  if (STATUS_ORDER.includes(v)) return v;
  const found = STATUS_ORDER.find(k=>normalizeHeaderText(STATUS_LABELS[k])===v);
  return found || 'pendiente';
}
function parseTemplateAssignees(val){
  const s = String(val||'').trim();
  if (!s) return [];
  return s.split(/[;,]/).map(part=>part.trim().replace(/\s*\(.*\)\s*$/, '')).filter(Boolean).map(name=>({ name }));
}
function parseTemplateDueDate(val){
  if (val instanceof Date && !isNaN(val)) return toISODate(val);
  const s = String(val||'').trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  return isNaN(d) ? null : toISODate(d);
}
function parseXlsxTemplateFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    reader.onload = () => {
      try {
        const data = new Uint8Array(reader.result);
        const wb = XLSX.read(data, { type:'array', cellDates:true });
        const sheetName = wb.SheetNames[0];
        if (!sheetName) throw new Error('El archivo Excel no tiene ninguna hoja con datos.');
        const rawRows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval:'' });
        const tasks = rawRows.map(row=>({
          title: String(getTemplateCell(row, ['titulo','tarea','title']) || '').trim(),
          priority: parseTemplatePriority(getTemplateCell(row, ['prioridad','priority'])),
          status: parseTemplateStatus(getTemplateCell(row, ['estado','status'])),
          dueDate: parseTemplateDueDate(getTemplateCell(row, ['fecha limite','fecha','vence','due'])),
          assignees: parseTemplateAssignees(getTemplateCell(row, ['responsables','responsable','asignados','personas asignadas','assignees'])),
          note: String(getTemplateCell(row, ['nota','notas','note']) || '').trim(),
        })).filter(t=>t.title);
        resolve(tasks);
      } catch (err) { reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}

function showFormError(form, msg){
  let e = form.querySelector('.inline-form-error');

    if (submitBtn) submitBtn.insertAdjacentElement('beforebegin', e); else form.appendChild(e);
  }
  e.innerHTML = icon('alertTriangle',{size:14}) + ' ' + msg.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function attachmentTypeForFile(file){
  const name = (file.name||'').toLowerCase();
  if (file.type === 'application/pdf' || name.endsWith('.pdf')) return 'pdf';
  if (file.type.startsWith('image/')) return 'image';
  if (name.endsWith('.doc') || name.endsWith('.docx')) return 'word';
  if (name.endsWith('.xls') || name.endsWith('.xlsx')) return 'excel';
  if (name.endsWith('.ppt') || name.endsWith('.pptx')) return 'ppt';
  return 'file';
}

function semaphoreColor(pct){
  if (pct >= 85) return 'var(--good)';
  if (pct >= 60) return 'var(--warning)';
  return 'var(--critical)';
}
function semaphoreWord(pct){ if (pct>=85) return 'En buen curso'; if (pct>=60) return 'Atención'; return 'Crítico'; }

function deptStats(deptId){
  const tasks = TASKS.filter(t=>t.deptId===deptId);
  const total = tasks.length;
  const completadas = tasks.filter(t=>t.status==='completado').length;
  const atrasadas = tasks.filter(isOverdue).length;
  const pendientes = tasks.filter(t=>t.status==='pendiente').length;
  const progreso = tasks.filter(t=>t.status==='progreso').length;
  const revision = tasks.filter(t=>t.status==='revision').length;
  const pct = total ? Math.round(((total - atrasadas) / total) * 100) : 100;
  const checklist = CHECKLISTS[deptId];
  const clDone = checklist ? checklist.items.filter(i=>i.done).length : 0;
  const clTotal = checklist ? checklist.items.length : 0;
  const clPct = clTotal ? Math.round((clDone/clTotal)*100) : 0;
  return { total, completadas, atrasadas, pendientes, progreso, revision, pct, clPct };
}

function institutionalStats(){
  const total = TASKS.length;
  const completadas = TASKS.filter(t=>t.status==='completado').length;
  const atrasadas = TASKS.filter(isOverdue).length;
  const pct = Math.round(DEPARTMENTS.reduce((s,d)=>s+deptStats(d.id).pct,0) / DEPARTMENTS.length);
  const onTimePct = total ? Math.round(((total-atrasadas)/total)*100) : 100;
  return { total, completadas, atrasadas, pct, onTimePct };
}

      ${state.recoveryError ? `<div class="invite-error" style="margin-bottom:12px;">${icon('alertTriangle',{size:14})} ${state.recoveryError}</div>` : ''}
      <form data-action="reset-password-confirm">
        <div class="field" style="margin-bottom:12px;">
          <label>Nueva contraseña</label>
          <div class="pw-wrap"><input type="password" name="password" placeholder="Mínimo 6 caracteres" autofocus ${state.recoveryBusy?'disabled':''}><button type="button" class="pw-toggle" data-action="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña">${icon('eye',{size:16})}</button></div>
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label>Confirmar nueva contraseña</label>
          <div class="pw-wrap"><input type="password" name="password2" placeholder="••••••••" ${state.recoveryBusy?'disabled':''}><button type="button" class="pw-toggle" data-action="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña">${icon('eye',{size:16})}</button></div>
        </div>
        <button type="submit" class="btn primary" style="width:100%;justify-content:center;" ${state.recoveryBusy?'disabled':''}>${icon('login',{size:15})} ${state.recoveryBusy?'Guardando…':'Guardar nueva contraseña'}</button>
      </form>
    </div>
  </div>`;
}
function togglePasswordField(btn){
  const input = btn.parentElement.querySelector('input');
  if (!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.innerHTML = icon(show ? 'eyeOff' : 'eye', {size:16});
  const label = show ? 'Ocultar contraseña' : 'Mostrar contraseña';
  btn.setAttribute('aria-label', label); btn.setAttribute('title', label);
  btn.setAttribute('aria-pressed', show ? 'true' : 'false');
}
function bindLoginEvents(){
  document.querySelectorAll('#app [data-action="toggle-password"]').forEach(el=>el.addEventListener('click', ()=> togglePasswordField(el)));
  const app = document.getElementById('app');
  app.querySelectorAll('[data-action="login-submit"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const raw = form.email.value.trim();
    const emailLower = raw.toLowerCase();
    const password = form.password.value;
    state.loginEmailValue = raw;
    if (!emailLower || !password){
      state.loginError = 'Escribe tu correo y tu contraseña para continuar.';
      render(); return;
    }
    if (!emailLower.endsWith(DOMAIN)){
      state.loginError = `Solo se aceptan correos institucionales ${DOMAIN}.`;
      render(); return;
    }
    const client = getSupabaseClient();
    if (!client){
      state.loginError = 'No hay una conexión a Supabase configurada.';
      render(); return;
    }
    state.loginBusy = true; state.loginError = null; render();
    try {
      const { data: authData, error: authErr } = await client.auth.signInWithPassword({ email: emailLower, password });
      if (authErr){
        state.loginError = friendlySupabaseError(authErr);
        state.loginBusy = false; render(); return;
      }
      const { data: profile, error: profileErr } = await client.from('profiles').select('*').eq('id', authData.user.id).maybeSingle();
      if (profileErr){
        state.loginError = 'Tu contraseña es correcta, pero no pudimos leer tu perfil: ' + friendlySupabaseError(profileErr);
        await client.auth.signOut();
        state.loginBusy = false; render(); return;
      }
      if (!profile){
        state.loginError = 'Tu acceso existe en Supabase Authentication pero todavía no tiene una fila en la tabla "profiles" — pide a quien administra la base de datos que la cree (ver SUPABASE_SETUP.md, paso 2).';
        await client.auth.signOut();
        state.loginBusy = false; render(); return;
      }
      if (profile.status === 'inactivo'){
        state.loginError = 'Este acceso fue desactivado. Contacta a Dirección General.';
        await client.auth.signOut();
        state.loginBusy = false; render(); return;
      }
      // Fusiona el perfil real de Supabase con el directorio local (para que el resto de
      // los módulos — todavía basados en datos de ejemplo en esta fase — sigan funcionando).
      const remoteUser = {
        id: profile.id, name: profile.name, email: profile.email, deptId: profile.dept_id,
        role: profile.role, cargo: profile.cargo, status: profile.status, lastReviewOffset: null, _remote: true,
      };
      const existingIdx = USERS.findIndex(u=>u.email.toLowerCase()===profile.email.toLowerCase());
      if (existingIdx > -1) USERS[existingIdx] = remoteUser; else USERS.push(remoteUser);
      state.authed = true;
      state.realSession = true;
      state.currentUserId = remoteUser.id;
      state.loginError = null;
      state.loginBusy = false;
      render();
      loadRemoteTasksModule(); // carga tareas/checklists en segundo plano, no bloquea el login
    } catch (err){
      state.loginError = 'No se pudo contactar Supabase: ' + friendlySupabaseError(err);
      state.loginBusy = false;
      render();
    }
  }));

  app.querySelectorAll('[data-action="login-toggle-mode"]').forEach(el=>el.addEventListener('click', e=>{
    e.preventDefault();
    state.loginMode = state.loginMode === 'signup' ? 'signin' : 'signup';
    state.loginError = null; state.loginNotice = null;
    render();
  }));

  app.querySelectorAll('[data-action="login-forgot-password"]').forEach(el=>el.addEventListener('click', e=>{
    e.preventDefault();
    state.loginMode = 'reset'; state.loginError = null; state.loginNotice = null;
    render();
  }));
  app.querySelectorAll('[data-action="login-back-to-signin"]').forEach(el=>el.addEventListener('click', e=>{
    e.preventDefault();
    state.loginMode = 'signin'; state.loginError = null; state.loginNotice = null;
    render();
  }));
  app.querySelectorAll('[data-action="reset-password-request"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const raw = form.email.value.trim();
    const emailLower = raw.toLowerCase();
    state.loginEmailValue = raw;
    if (!emailLower){ state.loginError = 'Escribe tu correo institucional para continuar.'; render(); return; }
    if (!emailLower.endsWith(DOMAIN)){ state.loginError = `Solo se aceptan correos institucionales ${DOMAIN}.`; render(); return; }
    const client = getSupabaseClient();
    if (!client){ state.loginError = 'No hay una conexión a Supabase configurada.'; render(); return; }
    state.loginBusy = true; state.loginError = null; render();
    try {
      // La URL a la que Supabase redirige después de que la persona hace clic en el
      // enlace del correo — debe estar en Authentication → URL Configuration →
      // Redirect URLs de tu proyecto (ver SUPABASE_SETUP.md). Usamos la URL actual
      // de esta página para que funcione dondequiera que la tengas publicada.
      const redirectTo = window.location.href.split('#')[0].split('?')[0];
      const { error } = await client.auth.resetPasswordForEmail(emailLower, { redirectTo });
      if (error) throw error;
      state.loginBusy = false;
      state.loginMode = 'signin';
      // Por seguridad, Supabase no distingue si el correo existe o no — el mensaje es el mismo en ambos casos.
      state.loginNotice = 'Si ese correo tiene una cuenta activa, te enviamos un enlace para restablecer la contraseña — revisa tu bandeja de entrada (y la carpeta de spam). El enlace vence después de un tiempo.';
      render();
    } catch (err) {
      state.loginBusy = false;
      state.loginError = 'No se pudo enviar el correo: ' + friendlySupabaseError(err);
      render();
    }
  }));
  app.querySelectorAll('[data-action="reset-password-confirm"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const password = form.password.value;
    const password2 = form.password2.value;
    if (!password || password.length < 6){ state.recoveryError = 'La contraseña debe tener al menos 6 caracteres.'; render(); return; }
    if (password !== password2){ state.recoveryError = 'Las contraseñas no coinciden.'; render(); return; }
    const client = getSupabaseClient();
    if (!client){ state.recoveryError = 'No hay una conexión a Supabase configurada.'; render(); return; }
    state.recoveryBusy = true; state.recoveryError = null; render();
    try {
      const { error } = await client.auth.updateUser({ password });
      if (error) throw error;
      await client.auth.signOut().catch(()=>{});
      // Limpia el token de recuperación de la URL para que no se reactive esta pantalla al recargar.
      try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch(e){}
      state.recoveryBusy = false;
      state.recoveryMode = false;
      state.loginMode = 'signin';
      state.loginEmailValue = '';
      state.loginNotice = 'Tu contraseña se actualizó correctamente. Inicia sesión con tu nueva contraseña.';
      render();
    } catch (err) {
      state.recoveryBusy = false;
      state.recoveryError = friendlySupabaseError(err);
      render();
    }
  }));

  app.querySelectorAll('[data-action="signup-submit"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const name = form.name.value.trim();
    const raw = form.email.value.trim();
    const emailLower = raw.toLowerCase();
    const password = form.password.value;
    const password2 = form.password2.value;
    state.signupNameValue = name; state.loginEmailValue = raw;
    if (!name || !emailLower || !password){
      state.loginError = 'Completa nombre, correo y contraseña para continuar.';
      render(); return;
    }
    if (!emailLower.endsWith(DOMAIN)){
      state.loginError = `Solo se aceptan correos institucionales ${DOMAIN}.`;
      render(); return;
    }
    if (password.length < 6){
      state.loginError = 'La contraseña debe tener al menos 6 caracteres.';
      render(); return;
    }
    if (password !== password2){
      state.loginError = 'Las contraseñas no coinciden.';
      render(); return;
    }
    const client = getSupabaseClient();
    if (!client){ state.loginError = 'No hay una conexión a Supabase configurada.'; render(); return; }
    state.loginBusy = true; state.loginError = null; render();
    try {
      const { data: signUpData, error: signUpErr } = await client.auth.signUp({
        email: emailLower, password, options: { data: { name } },
      });
      if (signUpErr){
        state.loginError = friendlySupabaseError(signUpErr);
        state.loginBusy = false; render(); return;
      }
      if (!signUpData.session){
        // El proyecto exige confirmar el correo antes de iniciar sesión.
        state.loginMode = 'signin';
        state.loginNotice = 'Cuenta creada. Revisa tu correo institucional y confirma tu cuenta antes de iniciar sesión (si no tenías una invitación pendiente con ese correo, avisa a Dirección).';
        state.loginBusy = false; render(); return;
      }
      // El proyecto permite iniciar sesión de inmediato (confirmación de correo desactivada) — seguimos igual que en login-submit.
      const { data: profile, error: profileErr } = await client.from('profiles').select('*').eq('id', signUpData.user.id).maybeSingle();
      if (profileErr || !profile){
        state.loginMode = 'signin';
        state.loginNotice = 'Cuenta creada, pero todavía no tiene un perfil activo (revisa que Dirección haya creado tu invitación con este mismo correo antes de registrarte). Contacta a Dirección General.';
        await client.auth.signOut();
        state.loginBusy = false; render(); return;
      }
      const remoteUser = {
        id: profile.id, name: profile.name, email: profile.email, deptId: profile.dept_id,
        role: profile.role, cargo: profile.cargo, status: profile.status, lastReviewOffset: null, _remote: true,
      };
      const existingIdx = USERS.findIndex(u=>u.email.toLowerCase()===profile.email.toLowerCase());
      if (existingIdx > -1) USERS[existingIdx] = remoteUser; else USERS.push(remoteUser);
      state.authed = true;
      state.realSession = true;
      state.currentUserId = remoteUser.id;
      state.loginBusy = false;
      render();
      loadRemoteTasksModule(); // carga tareas/checklists en segundo plano, no bloquea el login
    } catch (err){
      state.loginError = 'No se pudo contactar Supabase: ' + friendlySupabaseError(err);
      state.loginBusy = false;
      render();
    }
  }));
}

function renderTopbar(){
  let title = 'Panel General';
  let crumb = ROLE_LABELS[currentUser().role] + ' · Vista institucional';
  if (state.view==='department'){
    const d = dept(state.deptId);
    title = d.name;
    crumb = d.coord ? ('Departamento · Coordinador(a): ' + d.coord) : 'Departamento';
  } else if (state.view==='calendar'){
    title = 'Calendario institucional';
    crumb = isLeadership() ? 'Fechas límite de todos los departamentos' : 'Fechas límite de ' + dept(currentUser().deptId).name;
  } else if (state.view==='users'){
    title = 'Usuarios y Roles';
    crumb = isLeadership() ? 'Gestión de accesos institucionales (@happylearningschool.net)' : 'Equipo de ' + dept(currentUser().deptId).name;
  } else if (state.view==='mytasks'){
    title = 'Mis Tareas';
    crumb = currentUser().name + ' · ' + (currentUser().deptId ? dept(currentUser().deptId).name : ROLE_LABELS[currentUser().role]);
  } else if (state.view==='settings'){
    title = 'Base de datos';
    crumb = 'Conexión a Supabase (solo Dirección / Gerencia)';
  }
  return `<div class="topbar"><div><h1>${title}</h1><div class="crumb">${crumb}</div></div></div>`;

function renderContent(){
  let body;
  const isTasksView = ['dashboard','department','calendar','mytasks'].includes(state.view) || (state.view==='settings' && !isLeadership());
  if (isRealSession() && isTasksView && !state.remoteTasks.loaded){
    body = state.remoteTasks.error
      ? `<div class="panel" style="padding:20px;"><div class="invite-error" style="margin-bottom:12px;">${icon('alertTriangle',{size:14})} ${state.remoteTasks.error}</div><button class="btn" data-action="reload-tasks-module">${icon('database',{size:13})} Reintentar</button></div>`
      : `<div class="panel" style="padding:24px;text-align:center;color:var(--text-muted);">${icon('database',{size:16})} Cargando datos institucionales desde Supabase…</div>`;
  }
  else if (state.view==='department') body = renderDepartment();
  else if (state.view==='calendar') body = renderCalendar();
  else if (state.view==='users') body = isRealSession() ? renderUsersRolesReal() : renderUsersRoles();
  else if (state.view==='settings') body = isLeadership() ? renderSettings() : renderMyTasks();
  else if (state.view==='mytasks') body = renderMyTasks();
  else body = isLeadership() ? renderDashboard() : renderMyTasks();
  if (state.taskModalId) body += renderTaskModal(state.taskModalId);
  if (state.newTaskDeptId) body += renderNewTaskModal(state.newTaskDeptId);
  if (state.remote.editUserId) body += renderEditUserModal();
  return body;
}

  </div>`;
}

// scope: 'dept' | 'personal'. items = arreglo COMPLETO (los índices originales se conservan al filtrar).
function renderChecklistItems(items, scope, emptyMsg){
  const q = normSearch(state.checklistSearch[scope]);
  const rows = items.map((it,i)=>({it,i})).filter(r => !q || normSearch(r.it.t).includes(q));
  const idp = scope==='dept' ? 'cl' : 'pcl';
  const tgl = scope==='dept' ? 'toggle-checklist' : 'toggle-personal';
  const rem = scope==='dept' ? 'remove-checklist-item' : 'remove-personal-item';
  const editing = state.checklistEdit && state.checklistEdit.scope===scope ? state.checklistEdit.idx : -1;
  const searchBar = items.length>0 ? renderSearchBox('checklist-search-'+scope, 'checklist-search', state.checklistSearch[scope], 'Buscar en el checklist…', `data-scope="${scope}"`, true) : '';
  const meta = (q && items.length>0) ? `<div class="search-meta">${rows.length} de ${items.length} elemento(s)</div>` : '';
  const body = rows.map(({it,i})=> i===editing ? `<div class="checklist-item" style="display:flex;align-items:center;gap:8px;">
        <form class="checklist-edit-row" data-action="save-checklist-edit" data-scope="${scope}" data-idx="${i}">
          <input type="text" name="item" id="checklist-edit-input" value="${escHtml(it.t)}" required>
          <button type="submit" class="btn primary" title="Guardar cambios">${icon('check',{size:13})} Guardar</button>
          <button type="button" class="btn" data-action="cancel-checklist-edit" title="Cancelar">${icon('x',{size:12})}</button>
        </form>
      </div>` : `<div class="checklist-item ${it.done?'done':''}" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="${idp}-${i}" ${it.done?'checked':''} data-action="${tgl}" data-idx="${i}">
        <label for="${idp}-${i}" style="flex:1;">${escHtml(it.t)}</label>
        <button class="item-btn" type="button" data-action="edit-checklist-item" data-scope="${scope}" data-idx="${i}" title="Editar elemento" aria-label="Editar elemento">${icon('edit',{size:13})}</button>
        <button class="remove item-btn" type="button" data-action="${rem}" data-idx="${i}" title="Eliminar" aria-label="Eliminar">${icon('x',{size:13})}</button>
      </div>`).join('');
  let tail = '';
  if (items.length===0) tail = `<div class="form-hint">${emptyMsg}</div>`;
  else if (rows.length===0) tail = `<div class="form-hint">No hay elementos que coincidan con «${escHtml(state.checklistSearch[scope])}».</div>`;
  return searchBar + meta + body + tail;
}

function taskMatchesFilters(t){
  const f = state.filters;
  if (!(f.resp==='all'||taskAssigneeList(t).some(a=>a.name===f.resp))) return false;
  if (!(f.status==='all'||t.status===f.status)) return false;
  if (!(f.priority==='all'||t.priority===f.priority)) return false;
  const q = normSearch(state.taskSearch);
  if (q){
    const hay = normSearch([t.title, taskAssigneeList(t).map(a=>a.name).join(' '), STATUS_LABELS[t.status], PRIORITY_LABELS[t.priority]].join(' '));
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function focusEnd(id){
  const el = document.getElementById(id);
  if (el){ el.focus(); try { const p = el.value.length; el.setSelectionRange(p,p); } catch(e){} }
  return el;
}

function renderKanban(d, tasks){
  return `<div class="kanban">
    ${STATUS_ORDER.map(statusKey=>{
      const col = tasks.filter(t=>t.status===statusKey);
      return `<div class="kanban-col">
        <div class="kanban-col-head"><span>${STATUS_LABELS[statusKey]}</span><span class="count">${col.length}</span></div>
        <div class="kanban-col-body" data-status="${statusKey}" data-action="kanban-drop">
          ${col.map(t=>renderTaskCard(t)).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderTaskCard(t){
  const due = dueDate(t);
  const over = isOverdue(t);
  const attCount = (TASK_ATTACHMENTS[t.id]||[]).length;
  const noteCount = (TASK_NOTES[t.id]||[]).length;
  const bits = [];
  if (attCount) bits.push(icon('paperclip',{size:12})+attCount);
  if (noteCount) bits.push(icon('fileText',{size:12})+noteCount);
  return `<div class="task-card" draggable="true" data-taskid="${t.id}" data-action="drag-task">
    <div class="t-title">${t.title}</div>
    <div class="t-meta">
      <span class="t-resp">${taskAssigneeSummary(t)}</span>
      <span class="badge priority-${t.priority}">${PRIORITY_LABELS[t.priority]}</span>
    </div>
    <div class="t-due ${over?'overdue':''}">${over?'Venció':'Vence'} ${fmtDateShort(due)}</div>
    <button class="card-attach-btn" data-action="open-task-modal" data-taskid="${t.id}">${bits.length? bits.join(' · ')+' · ' : ''}Ver / editar</button>
  </div>`;
}

function renderTaskList(d, tasks){
  const filtered = tasks.filter(taskMatchesFilters).sort((a,b)=> dueDate(a)-dueDate(b));

  if (filtered.length===0) return `<div class="panel"><div class="empty-state">${state.taskSearch.trim() ? 'No hay tareas que coincidan con «'+escHtml(state.taskSearch.trim())+'» y los filtros seleccionados.' : 'No hay tareas que coincidan con los filtros seleccionados.'}</div></div>`;

  const allSelected = filtered.length>0 && filtered.every(t=>state.selectedTaskIds.has(t.id));

  return `<div class="panel">
    <table class="task-list-table">
      <thead><tr><th class="row-select-cell"><input type="checkbox" data-action="select-all-tasks" ${allSelected?'checked':''}></th><th>Tarea</th><th>Responsable(s)</th><th>Prioridad</th><th>Estado</th><th>Vence</th><th>Detalle</th></tr></thead>
      <tbody>
        ${filtered.map(t=>{
          const over = isOverdue(t);
          const attCount = (TASK_ATTACHMENTS[t.id]||[]).length;
          const noteCount = (TASK_NOTES[t.id]||[]).length;
          const bits = [attCount?icon('paperclip',{size:12})+attCount:null, noteCount?icon('fileText',{size:12})+noteCount:null].filter(Boolean).join(' ');
          const checked = state.selectedTaskIds.has(t.id);
          return `<tr data-action="open-task-modal" data-taskid="${t.id}" class="${checked?'row-selected':''}">
            <td class="row-select-cell"><input type="checkbox" data-action="select-task" data-taskid="${t.id}" ${checked?'checked':''}></td>
            <td>${t.title}</td>
            <td>${taskAssigneeSummary(t)}</td>
            <td><span class="badge priority-${t.priority}">${PRIORITY_LABELS[t.priority]}</span></td>
            <td><span class="badge status-${over?'atrasado':t.status}">${over?'Atrasado':STATUS_LABELS[t.status]}</span></td>
            <td style="${over?'color:var(--critical);font-weight:700;':''}">${fmtDateShort(dueDate(t))}</td>
            <td>${bits || '—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

/* =========================================================
   RENDER: CALENDARIO
   ========================================================= */
function renderCalendar(){
  const monthStart = state.calMonth;
  const monthLabel = monthStart.toLocaleDateString('es-ES', { month:'long', year:'numeric' });
  const firstWeekday = (monthStart.getDay()+6)%7; // lunes=0
  const daysInMonth = new Date(monthStart.getFullYear(), monthStart.getMonth()+1, 0).getDate();
  const gridStart = addDays(monthStart, -firstWeekday);

  const calTasks = isLeadership() ? TASKS : TASKS.filter(t=>t.deptId===currentUser().deptId);
  const tasksByDay = {};
  calTasks.forEach(t=>{
    const due = dueDate(t);
    const key = due.toDateString();
    (tasksByDay[key] = tasksByDay[key] || []).push(t);
  });

  let cells = '';
  for (let i=0;i<42;i++){
    const cellDate = addDays(gridStart, i);
    const inMonth = cellDate.getMonth()===monthStart.getMonth();
    const key = cellDate.toDateString();
    const dayTasks = tasksByDay[key] || [];
    const isToday = sameDay(cellDate, today());
    const isSelected = state.calSelected && sameDay(cellDate, state.calSelected);
    const dots = dayTasks.slice(0,6).map(t=>`<span class="cal-dot" style="background:${dept(t.deptId).color}"></span>`).join('');
    cells += `<div class="cal-day ${inMonth?'':'other-month'} ${isToday?'today':''} ${isSelected?'selected':''}" data-action="cal-select" data-date="${cellDate.toISOString()}">
      <div class="num">${cellDate.getDate()}</div>
      <div class="cal-dot-row">${dots}</div>
      ${dayTasks.length>6?`<div class="more">+${dayTasks.length-6} más</div>`:''}
    </div>`;
    if (i>=34 && cellDate.getMonth()!==monthStart.getMonth() && (i+1)%7===0) break;
  }

  let dayDetail = '';
  if (state.calSelected){
    const key = state.calSelected.toDateString();
    const list = tasksByDay[key] || [];
    dayDetail = `<div class="day-detail section">
      <div class="section-head"><h2>Tareas con vencimiento el ${fmtDate(state.calSelected)}</h2></div>
      <div class="panel">
        ${list.length===0 ? '<div class="empty-state">No hay tareas con vencimiento este día.</div>' : `
        <table class="task-list-table">
          <thead><tr><th>Tarea</th><th>Departamento</th><th>Responsable</th><th>Estado</th></tr></thead>
          <tbody>
          ${list.map(t=>{
            const d = dept(t.deptId); const over = isOverdue(t);
            return `<tr data-action="open-dept" data-dept="${t.deptId}">
              <td>${t.title}</td>
              <td><span class="dept-color-dot" style="background:${d.color};display:inline-block;margin-right:6px;"></span>${d.name}</td>
              <td>${taskAssigneeSummary(t)}</td>
              <td><span class="badge status-${over?'atrasado':t.status}">${over?'Atrasado':STATUS_LABELS[t.status]}</span></td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>`}
      </div>
    </div>`;
  }

  return `
  <div class="cal-nav">
    <button class="btn" data-action="cal-prev">←</button>
    <div class="label">${monthLabel}</div>
    <button class="btn" data-action="cal-next">→</button>
    <button class="btn" data-action="cal-today">Hoy</button>
  </div>
  <div class="panel" style="padding:16px;">
    <div class="cal-grid">
      ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>
  ${dayDetail}`;
}
