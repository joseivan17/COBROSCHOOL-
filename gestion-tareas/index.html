    <div class="panel" style="padding:18px 20px;">
      <div class="form-hint" style="margin:0 0 16px;line-height:1.5;">
        Esta pantalla guarda los datos de conexión de tu proyecto Supabase <b>solo en la memoria de esta sesión del navegador</b> (se pierden al recargar) y verifica que la URL y la clave respondan. Es la base de configuración para la integración real: conectar cada módulo (tareas, checklists, usuarios, adjuntos) a tablas de Supabase con sincronización persistente es un trabajo de desarrollo más amplio, propio de la aplicación de producción — no de esta vista de demostración.
      </div>
      <form data-action="save-supabase" style="display:grid;gap:12px;max-width:520px;">
        <div class="field">
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:5px;">URL del proyecto Supabase</label>
          <input type="text" name="url" placeholder="https://tu-proyecto.supabase.co" value="${sb.url.replace(/"/g,'&quot;')}" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);font-size:13px;">
        </div>
        <div class="field">
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:5px;">Clave pública (anon / publishable key)</label>
          <input type="text" name="anonKey" placeholder="sb_publishable_… o eyJhbGciOi…" value="${sb.anonKey.replace(/"/g,'&quot;')}" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);font-size:13px;font-family:monospace;">
          <div class="form-hint">Usa siempre la clave <b>anon/publishable</b> del proyecto (puede empezar con <code>sb_publishable_</code> en proyectos nuevos, o ser un token largo tipo JWT en proyectos con las claves antiguas). Nunca coloques la <b>service role</b> ni la <b>secret</b> key aquí: al ser una aplicación que corre en el navegador, cualquier clave visible en el código queda expuesta al usuario final.</div>
        </div>
        ${statusBanner}
        <div style="display:flex;gap:8px;">
          <button type="submit" class="btn primary">${icon('database',{size:14})} Guardar y probar conexión</button>
          ${sb.url || sb.anonKey ? `<button type="button" class="btn" data-action="clear-supabase">${icon('x',{size:13})} Quitar configuración</button>` : ''}
        </div>
      </form>
    </div>
  </div>`;
}

/* =========================================================
   RENDER: MIS TAREAS
   ========================================================= */
function renderMyTasks(){
  const u = currentUser();
  const mine = TASKS.filter(t => t.resp === u.name).map(t=>({...t, due:dueDate(t), over:isOverdue(t)})).sort((a,b)=>a.due-b.due);
  const checklist = PERSONAL_CHECKLISTS[u.id] || (PERSONAL_CHECKLISTS[u.id] = []);
  const clDone = checklist.filter(i=>i.done).length;
  const clPct = checklist.length ? Math.round(clDone/checklist.length*100) : 0;

  const assigned = `
    <div class="section-head"><h2>Tareas asignadas a mí</h2><span class="hint">${mine.length} tarea(s)</span></div>
    <div class="panel">
      ${mine.length===0 ? `<div class="empty-state">${(u.role==='directora'||u.role==='gerente') ? 'No tienes tareas operativas asignadas todavía — puedes asignarte una desde cualquier departamento con "+ Nueva tarea", o usar el Panel General para el seguimiento institucional.' : 'No tienes tareas asignadas por el momento.'}</div>` : `
      <table class="task-list-table">
        <thead><tr><th>Tarea</th><th>Departamento</th><th>Asignado por</th><th>Prioridad</th><th>Vence</th><th>Estado</th></tr></thead>
        <tbody>
          ${mine.map(t=>{
            const d = dept(t.deptId);
            return `<tr>
              <td style="cursor:pointer;" data-action="open-task-modal" data-taskid="${t.id}">${t.title} ${(TASK_ATTACHMENTS[t.id]||[]).length>0?icon('paperclip',{size:12}):''}</td>
              <td><span class="dept-color-dot" style="background:${d.color};display:inline-block;margin-right:6px;"></span>${d.name}</td>
              <td style="color:var(--text-muted);">${t.assignedBy ? t.assignedBy : '<span style="font-style:italic;">Predefinida</span>'}</td>
              <td><span class="badge priority-${t.priority}">${PRIORITY_LABELS[t.priority]}</span></td>
              <td style="${t.over?'color:var(--critical);font-weight:700;':''}">${fmtDateShort(t.due)}${t.over?' · vencida':''}</td>
              <td><select data-action="update-my-task-status" data-taskid="${t.id}">
                ${STATUS_ORDER.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
              </select></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>`;

  const personal = `
    <div class="section-head"><h2>Mi checklist personal</h2><span class="hint">Privado — solo lo ves tú</span></div>
    <div class="checklist-card panel">
      <div class="checklist-head"><span class="title">${icon('clipboard',{size:15})} Pendientes personales</span><span class="pct" style="color:${semaphoreColor(clPct)}">${checklist.length? clPct+'%' : '—'}</span></div>
      ${state.checklistError ? `<div class="invite-error" style="margin-bottom:8px;">${icon('alertTriangle',{size:14})} ${state.checklistError}</div>` : ''}
      ${checklist.length>0 ? `<div class="progress-track" style="margin-bottom:10px;"><div class="progress-fill" style="width:${clPct}%;background:${semaphoreColor(clPct)}"></div></div>` : ''}
      ${checklist.map((it,i)=>`<div class="checklist-item ${it.done?'done':''}" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="pcl-${i}" ${it.done?'checked':''} data-action="toggle-personal" data-idx="${i}">
        <label for="pcl-${i}" style="flex:1;">${it.t}</label>
        <button class="remove" data-action="remove-personal-item" data-idx="${i}" title="Eliminar pendiente" style="border:none;background:none;color:var(--text-muted);cursor:pointer;">${icon('x',{size:13})}</button>
      </div>`).join('')}
      ${checklist.length===0 ? '<div class="form-hint">Aún no agregas pendientes personales.</div>' : ''}
      <form class="checklist-add-row" data-action="add-personal-item">
        <input type="text" name="item" placeholder="Agregar un pendiente personal…" required>
        <button type="submit" class="btn">+ Agregar</button>
      </form>
    </div>`;

  return `<div class="section">${assigned}</div><div class="section">${personal}</div>`;
}

/* =========================================================
   EVENTOS
   ========================================================= */
function bindEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-action="open-dashboard"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='dashboard'; render();
    if (isRealSession() && !state.remoteTasks.loaded && !state.remoteTasks.loading) loadRemoteTasksModule();
  }));
  app.querySelectorAll('[data-action="open-calendar"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='calendar'; state.calSelected=null; render();
    if (isRealSession() && !state.remoteTasks.loaded && !state.remoteTasks.loading) loadRemoteTasksModule();
  }));
  app.querySelectorAll('[data-action="open-dept"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='department'; state.deptId=el.getAttribute('data-dept'); state.deptSubview='kanban';
    state.filters={resp:'all',status:'all',priority:'all'}; state.checklistError=null; render();
    if (isRealSession() && !state.remoteTasks.loaded && !state.remoteTasks.loading) loadRemoteTasksModule();
  }));
  app.querySelectorAll('[data-action="reload-tasks-module"]').forEach(el=>el.addEventListener('click', loadRemoteTasksModule));
  app.querySelectorAll('[data-action="dept-subview"]').forEach(el=>el.addEventListener('click',()=>{ state.deptSubview=el.getAttribute('data-sub'); render(); }));
  app.querySelectorAll('[data-action="filter"]').forEach(el=>el.addEventListener('change',()=>{
    state.filters[el.getAttribute('data-filter')] = el.value; render();
  }));
  app.querySelectorAll('[data-action="toggle-checklist"]').forEach(el=>el.addEventListener('change', async ()=>{
    const idx = parseInt(el.getAttribute('data-idx'),10);
    const item = CHECKLISTS[state.deptId].items[idx];
    const newDone = el.checked;
    if (isRealSession() && item._id){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('dept_checklist_items').update({ done: newDone }).eq('id', item._id);
        if (error) throw error;
        item.done = newDone;
        render();
      } catch (err) { state.checklistError = friendlySupabaseError(err); el.checked = item.done; render(); }
      return;
    }
    item.done = newDone;
    render();
  }));
  app.querySelectorAll('[data-action="remove-checklist-item"]').forEach(el=>el.addEventListener('click', async ()=>{
    const idx = parseInt(el.getAttribute('data-idx'),10);
    const item = CHECKLISTS[state.deptId].items[idx];
    if (isRealSession() && item._id){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('dept_checklist_items').delete().eq('id', item._id);
        if (error) throw error;
        CHECKLISTS[state.deptId].items.splice(idx,1);
        render();
      } catch (err) { state.checklistError = friendlySupabaseError(err); render(); }
      return;
    }
    CHECKLISTS[state.deptId].items.splice(idx,1);
    render();
  }));
  app.querySelectorAll('[data-action="add-checklist-item"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const text = form.item.value.trim();
    if (!text){ showFormError(form, 'Escribe un elemento antes de agregarlo.'); return; }
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const position = CHECKLISTS[state.deptId].items.length;
        const { data, error } = await client.from('dept_checklist_items').insert({ dept_id: state.deptId, text, done:false, position }).select().single();
        if (error) throw error;
        CHECKLISTS[state.deptId].items.push({ t: data.text, done: data.done, _id: data.id });
        render();
      } catch (err) { showFormError(form, friendlySupabaseError(err)); }
      return;
    }
    CHECKLISTS[state.deptId].items.push({ t: text, done: false });
    render();
  }));
  app.querySelectorAll('[data-action="toggle-theme"]').forEach(el=>el.addEventListener('click', toggleTheme));

  // Calendar nav
  app.querySelectorAll('[data-action="cal-prev"]').forEach(el=>el.addEventListener('click',()=>{
    state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()-1, 1); render();
  }));
  app.querySelectorAll('[data-action="cal-next"]').forEach(el=>el.addEventListener('click',()=>{
    state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+1, 1); render();
  }));
  app.querySelectorAll('[data-action="cal-today"]').forEach(el=>el.addEventListener('click',()=>{
    const d = today(); state.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); state.calSelected = d; render();
  }));
  app.querySelectorAll('[data-action="cal-select"]').forEach(el=>el.addEventListener('click',()=>{
    state.calSelected = new Date(el.getAttribute('data-date')); render();
  }));

  // Drag & drop (Kanban)
  app.querySelectorAll('.task-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', card.getAttribute('data-taskid')); e.dataTransfer.effectAllowed='move'; });
  });
  app.querySelectorAll('.kanban-col-body').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('drag-over'));
    col.addEventListener('drop', async e=>{
      e.preventDefault(); col.classList.remove('drag-over');
      const taskId = e.dataTransfer.getData('text/plain');
      const task = TASKS.find(t=>t.id===taskId);
      if (!task) return;
      const newStatus = col.getAttribute('data-status');
      if (isRealSession()){
        const client = getSupabaseClient();
        try {
          const { error } = await client.from('tasks').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', taskId);
          if (error) throw error;
          task.status = newStatus; render();
        } catch (err) { state.taskError = friendlySupabaseError(err); render(); }
        return;
      }
      task.status = newStatus; render();
    });
  });

  // Ver como / navegación de roles
  app.querySelectorAll('[data-action="switch-user"]').forEach(el=>el.addEventListener('change',()=>{
    state.currentUserId = el.value;
    const u = currentUser();
    state.taskModalId = null; state.newTaskDeptId = null; state.deleteConfirmId = null; state.inviteError = null; state.inviteBanner = null;
    if (u.role==='directora' || u.role==='gerente'){ state.view = 'dashboard'; state.deptId = null; }
    else { state.view = 'department'; state.deptId = u.deptId; state.deptSubview = 'kanban'; state.filters = {resp:'all',status:'all',priority:'all'}; }
    render();
  }));
  app.querySelectorAll('[data-action="open-users"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='users'; state.inviteError=null; state.inviteBanner=null; render();
    if (isRealSession() && !state.remote.users && !state.remote.loading) loadRemoteUsersModule();
  }));
  app.querySelectorAll('[data-action="open-mytasks"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='mytasks'; render();
    if (isRealSession() && !state.remoteTasks.loaded && !state.remoteTasks.loading) loadRemoteTasksModule();
  }));
  app.querySelectorAll('[data-action="open-settings"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='settings'; render();
    if (isRealSession() && !isLeadership() && !state.remoteTasks.loaded && !state.remoteTasks.loading) loadRemoteTasksModule();
  }));
  app.querySelectorAll('[data-action="logout"]').forEach(el=>el.addEventListener('click', async ()=>{
    const client = getSupabaseClient();
    if (client) { try { await client.auth.signOut(); } catch(e){ /* ignorar: de todas formas cerramos la sesión local */ } }
    state.authed = false; state.realSession = false; state.loginError = null; state.loginEmailValue=''; state.view='dashboard';
    state.currentUserId = 'u-admin';
    state.remote = {
      users: null, invites: null, auditLog: null, loading: false, error: null, savingId: null,
      createMode: 'create', createBusy: false, createError: null, createBanner: null,
      editUserId: null, editError: null, deleteConfirmId: null,
    };
    state.remoteTasks = { loaded: false, loading: false, error: null };
    restoreDemoData(); // evita mezclar datos reales de Supabase con el modo demo/"Ver como"
    render();
  }));
  app.querySelectorAll('[data-action="clear-supabase"]').forEach(el=>el.addEventListener('click',()=>{
    state.supabase = { url:'', anonKey:'', status:null, message:'' };
    render();
  }));
  app.querySelectorAll('[data-action="save-supabase"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    // Acepta tanto la URL base del proyecto como la URL completa del endpoint REST
    // (algunos paneles de Supabase muestran "https://xxx.supabase.co/rest/v1" directamente) —
    // se normaliza quitando /rest/v1 al final para no duplicarlo después.
    const url = form.url.value.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');
    const anonKey = form.anonKey.value.trim();
    if (!url || !anonKey){
      showFormError(form, 'Completa la URL del proyecto y la clave pública antes de probar la conexión.');
      return;
    }
    state.supabase = { url, anonKey, status:'checking', message:'' };
    render();
    try {
      const resp = await fetch(url + '/rest/v1/', { headers: { apikey: anonKey, Authorization: 'Bearer ' + anonKey } });
      // El endpoint raíz de PostgREST responde 200 con el esquema OpenAPI cuando la clave es válida.
      // Un 404 aquí normalmente indica una URL de proyecto incorrecta, no una conexión exitosa.
      if (resp.ok) {
        state.supabase = { url, anonKey, status:'ok', message:'Conexión exitosa: el proyecto respondió correctamente y aceptó la clave. (Los módulos de esta demo siguen usando datos en memoria; conectar cada tabla es el siguiente paso de desarrollo.)' };
      } else if (resp.status === 401 || resp.status === 403) {
        state.supabase = { url, anonKey, status:'error', message:'El proyecto respondió pero rechazó la clave (' + resp.status + '). Verifica que sea la clave anon/publishable correcta y que no esté revocada.' };
      } else if (resp.status === 404) {
        state.supabase = { url, anonKey, status:'error', message:'El proyecto no encontró esa ruta (404). Revisa que la URL sea la URL base del proyecto (https://tu-proyecto.supabase.co), con o sin /rest/v1 al final — ambas formas se aceptan.' };
      } else {
        state.supabase = { url, anonKey, status:'error', message:'El proyecto respondió con un estado inesperado (' + resp.status + ').' };
      }
    } catch (err) {
      state.supabase = { url, anonKey, status:'error', message:'No se pudo contactar la URL indicada. Revisa que sea correcta y que tu conexión a internet esté disponible.' };
    }
    render();
  }));

  // Modal de tarea (ver / editar / adjuntos / notas)
  app.querySelectorAll('[data-action="open-task-modal"]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    state.taskModalId = el.getAttribute('data-taskid'); state.newTaskDeptId = null; state.deleteConfirmId = null; state.attachError = null; state.taskError = null; render();
  }));
  app.querySelectorAll('[data-action="close-modal"]').forEach(el=>el.addEventListener('click', e=>{
    if (el.classList.contains('modal-overlay') && e.target !== el) return;
    state.taskModalId = null; state.deleteConfirmId = null; state.attachError = null; state.taskError = null; render();
  }));
  app.querySelectorAll('[data-action="modal-status"]').forEach(el=>el.addEventListener('change', async ()=>{
    const task = TASKS.find(t=>t.id===el.getAttribute('data-taskid'));
    if (!task) return;
    const newVal = el.value;
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('tasks').update({ status: newVal, updated_at: new Date().toISOString() }).eq('id', task.id);
        if (error) throw error;
        task.status = newVal; render();
      } catch (err) { state.taskError = friendlySupabaseError(err); render(); }
      return;
    }
    task.status = newVal; render();
  }));
  app.querySelectorAll('[data-action="modal-title"]').forEach(el=>el.addEventListener('change', async ()=>{
    const task = TASKS.find(t=>t.id===el.getAttribute('data-taskid'));
    if (!task || !el.value.trim()) return;
    const newVal = el.value.trim();
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('tasks').update({ title: newVal, updated_at: new Date().toISOString() }).eq('id', task.id);
        if (error) throw error;
        task.title = newVal; render();
      } catch (err) { state.taskError = friendlySupabaseError(err); render(); }
      return;
    }
    task.title = newVal; render();
  }));
  app.querySelectorAll('[data-action="modal-resp"]').forEach(el=>el.addEventListener('change', async ()=>{
    const task = TASKS.find(t=>t.id===el.getAttribute('data-taskid'));
    const u = USERS.find(x=>x.id===el.value);
    if (!task || !u) return;
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('tasks').update({ resp_user_id: u.id, updated_at: new Date().toISOString() }).eq('id', task.id);
        if (error) throw error;
        task.resp = u.name; task.cargo = u.cargo || null; task._respUserId = u.id; render();
      } catch (err) { state.taskError = friendlySupabaseError(err); render(); }
      return;
    }
    task.resp = u.name; task.cargo = u.cargo || null; render();
  }));
  app.querySelectorAll('[data-action="modal-priority"]').forEach(el=>el.addEventListener('change', async ()=>{
    const task = TASKS.find(t=>t.id===el.getAttribute('data-taskid'));
    if (!task) return;
    const newVal = el.value;
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('tasks').update({ priority: newVal, updated_at: new Date().toISOString() }).eq('id', task.id);
        if (error) throw error;
        task.priority = newVal; render();
      } catch (err) { state.taskError = friendlySupabaseError(err); render(); }
      return;
    }
    task.priority = newVal; render();
  }));
  app.querySelectorAll('[data-action="modal-due"]').forEach(el=>el.addEventListener('change', async ()=>{
    const task = TASKS.find(t=>t.id===el.getAttribute('data-taskid'));
    if (!task || !el.value) return;
    const newVal = el.value;
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('tasks').update({ due_date: newVal, updated_at: new Date().toISOString() }).eq('id', task.id);
        if (error) throw error;
        task.dueDateFixed = newVal; render();
      } catch (err) { state.taskError = friendlySupabaseError(err); render(); }
      return;
    }
    task.dueDateFixed = newVal; render();
  }));
  app.querySelectorAll('[data-action="add-note"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const taskId = form.getAttribute('data-taskid');
    const text = form.noteText.value.trim();
    if (!text) return;
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const { data, error } = await client.from('task_notes').insert({ task_id: taskId, author_id: currentUser().id, text }).select().single();
        if (error) throw error;
        (TASK_NOTES[taskId] = TASK_NOTES[taskId] || []).push({ author: currentUser().name, offset:0, text, _id: data.id, _remote:true });
        render();
      } catch (err) { state.taskError = friendlySupabaseError(err); render(); }
      return;
    }
    (TASK_NOTES[taskId] = TASK_NOTES[taskId] || []).push({ author: currentUser().name, offset:0, text });
    render();
  }));
  app.querySelectorAll('[data-action="delete-task-confirm"]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.getAttribute('data-taskid');
    if (state.deleteConfirmId === id){
      if (isRealSession()){
        const client = getSupabaseClient();
        try {
          // task_notes/task_attachments tienen "on delete cascade": se limpian solas.
          const { error } = await client.from('tasks').delete().eq('id', id);
          if (error) throw error;
        } catch (err) { state.taskError = friendlySupabaseError(err); render(); return; }
      }
      const idx = TASKS.findIndex(t=>t.id===id);
      if (idx>-1) TASKS.splice(idx,1);
      delete TASK_ATTACHMENTS[id]; delete TASK_NOTES[id];
      state.deleteConfirmId = null; state.taskModalId = null;
    } else {
      state.deleteConfirmId = id;
    }
    render();
  }));
  app.querySelectorAll('[data-action="delete-task-cancel"]').forEach(el=>el.addEventListener('click', ()=>{ state.deleteConfirmId = null; render(); }));

  // Nueva tarea
  app.querySelectorAll('[data-action="open-new-task"]').forEach(el=>el.addEventListener('click', ()=>{
    state.newTaskDeptId = el.getAttribute('data-dept'); state.taskModalId = null; render();
  }));
  app.querySelectorAll('[data-action="close-new-task-modal"]').forEach(el=>el.addEventListener('click', e=>{
    if (el.classList.contains('modal-overlay') && e.target !== el) return;
    state.newTaskDeptId = null; render();
  }));
  app.querySelectorAll('[data-action="create-task"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const deptId = form.getAttribute('data-dept');
    const titleVal = form.title.value.trim();
    if (!titleVal){
      showFormError(form, 'Escribe un título para la tarea antes de crearla.');
      form.title.focus();
      return;
    }
    const respUser = USERS.find(u=>u.id===form.respId.value);
    const dueVal = form.due.value || toISODate(addDays(today(),7));
    const noteVal = form.note.value.trim();
    if (isRealSession()){
      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      try {
        const client = getSupabaseClient();
        const { data: newTask, error } = await client.from('tasks').insert({
          dept_id: deptId, title: titleVal, priority: form.priority.value, status: form.status.value,
          due_date: dueVal, resp_user_id: respUser ? respUser.id : null, assigned_by_user_id: currentUser().id,
        }).select().single();
        if (error) throw error;
        if (noteVal) await client.from('task_notes').insert({ task_id: newTask.id, author_id: currentUser().id, text: noteVal });
        TASKS.push({
          id: newTask.id, deptId, title: titleVal, priority: newTask.priority, status: newTask.status,
          dueOffset: 0, dueDateFixed: newTask.due_date,
          resp: respUser ? respUser.name : '—', cargo: respUser ? (respUser.cargo||null) : null,
          assignedBy: currentUser().name, _respUserId: newTask.resp_user_id, _assignedByUserId: newTask.assigned_by_user_id, _remote:true,
        });
        if (noteVal) TASK_NOTES[newTask.id] = [{ author: currentUser().name, offset:0, text: noteVal, _remote:true }];
        state.newTaskDeptId = null;
        render();
      } catch (err) {
        if (submitBtn) submitBtn.disabled = false;
        showFormError(form, friendlySupabaseError(err));
      }
      return;
    }
    const id = newTaskId();
    TASKS.push({
      id, deptId, title: titleVal, priority: form.priority.value, status: form.status.value,
      dueOffset: 0, dueDateFixed: dueVal,
      resp: respUser ? respUser.name : '—', cargo: respUser ? (respUser.cargo || null) : null,
      assignedBy: currentUser().name
    });
    if (noteVal) TASK_NOTES[id] = [{ author: currentUser().name, offset:0, text: noteVal }];
    state.newTaskDeptId = null;
    render();
  }));

  app.querySelectorAll('[data-action="add-drive-link"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const taskId = form.getAttribute('data-taskid');
    const url = form.driveUrl.value.trim();
    if (!url) return;
    state.attachError = null;
    const name = url.length>60 ? url.slice(0,60)+'…' : url;
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const { data, error } = await client.from('task_attachments').insert({ task_id: taskId, type:'link', name, url, uploaded_by: currentUser().id }).select().single();
        if (error) throw error;
        (TASK_ATTACHMENTS[taskId] = TASK_ATTACHMENTS[taskId] || []).push({ type:'link', name, url, _id: data.id, _remote:true });
        render();
      } catch (err) { state.attachError = friendlySupabaseError(err); render(); }
      return;
    }
    (TASK_ATTACHMENTS[taskId] = TASK_ATTACHMENTS[taskId] || []).push({ type:'link', name, url });
    render();
  }));
  app.querySelectorAll('[data-action="add-file-attachment"]').forEach(el=>el.addEventListener('change', async ()=>{
    const file = el.files[0]; if (!file) return;
    const taskId = el.getAttribute('data-taskid');
    const MAX_SIZE = 20 * 1024 * 1024;
    if (file.size > MAX_SIZE){
      state.attachError = `"${file.name}" pesa más de 20 MB — no se puede adjuntar. Comparte un enlace en su lugar.`;
      el.value = '';
      render();
      return;
    }
    if (isRealSession()){
      const task = TASKS.find(t=>t.id===taskId);
      const deptId = task ? task.deptId : state.deptId;
      const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
      const path = `${deptId}/${taskId}/${Date.now()}_${safeName}`;
      const type = attachmentTypeForFile(file);
      state.attachError = null; state.attachUploading = true; render();
      try {
        const client = getSupabaseClient();
        const { error: upErr } = await client.storage.from('task-attachments').upload(path, file, { upsert: false, contentType: file.type || undefined });
        if (upErr) throw upErr;
        const { data: signed, error: signErr } = await client.storage.from('task-attachments').createSignedUrl(path, 60*60*6);
        if (signErr) throw signErr;
        const { data: row, error: insErr } = await client.from('task_attachments').insert({
          task_id: taskId, type, name: file.name, url: signed.signedUrl, storage_path: path, uploaded_by: currentUser().id,
        }).select().single();
        if (insErr) throw insErr;
        (TASK_ATTACHMENTS[taskId] = TASK_ATTACHMENTS[taskId] || []).push({ type, name: file.name, url: signed.signedUrl, _id: row.id, _storagePath: path, _remote: true });
        state.attachUploading = false;
        el.value = '';
        render();
      } catch (err) {
        state.attachUploading = false;
        state.attachError = friendlySupabaseError(err);
        el.value = '';
        render();
      }
      return;
    }
    state.attachError = null;
    const url = URL.createObjectURL(file);
    const type = attachmentTypeForFile(file);
    (TASK_ATTACHMENTS[taskId] = TASK_ATTACHMENTS[taskId] || []).push({ type, name: file.name, url });
    render();
  }));
  app.querySelectorAll('[data-action="remove-attachment"]').forEach(el=>el.addEventListener('click', async ()=>{
    const taskId = el.getAttribute('data-taskid'); const idx = parseInt(el.getAttribute('data-idx'),10);
    const att = (TASK_ATTACHMENTS[taskId]||[])[idx];
    if (!att) return;
    if (isRealSession() && att._id){
      const client = getSupabaseClient();
      try {
        if (att._storagePath){
          const { error: rmErr } = await client.storage.from('task-attachments').remove([att._storagePath]);
          if (rmErr) throw rmErr;
        }
        const { error } = await client.from('task_attachments').delete().eq('id', att._id);
        if (error) throw error;
        TASK_ATTACHMENTS[taskId].splice(idx,1);
        render();
      } catch (err) { state.attachError = friendlySupabaseError(err); render(); }
      return;
    }
    TASK_ATTACHMENTS[taskId].splice(idx,1);
    render();
  }));

  // Usuarios y roles
  app.querySelectorAll('[data-action="invite-user"]').forEach(form=>form.addEventListener('submit', e=>{
    e.preventDefault();
    const email = form.email.value.trim().toLowerCase();
    const deptId = form.deptId.value;
    const role = form.role.value;
    state.inviteError = null; state.inviteBanner = null;
    if (!email.endsWith(DOMAIN)){
      state.inviteError = `El correo debe pertenecer al dominio institucional ${DOMAIN}.`;
      render(); return;
    }
    if (USERS.some(u=>u.email===email)){
      state.inviteError = 'Ya existe un usuario invitado o activo con ese correo.';
      render(); return;
    }
    const token = Math.random().toString(36).slice(2,10);
    const namePart = email.split('@')[0].split('.').filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
    const newUser = { id:'u-new-'+token.slice(0,5), name: namePart || email, email, deptId, role, cargo:null, status:'invitado', lastReviewOffset:null };
    USERS.push(newUser);
    AUDIT_LOG.push({ offset:0, actor: currentUser().name, action:'invitó a', target: `${newUser.name} (${dept(deptId).name})` });
    state.inviteBanner = { email, link: `https://panel.happylearningschool.net/invitacion/${token}` };
    render();
  }));
  app.querySelectorAll('[data-action="copy-invite-link"]').forEach(el=>el.addEventListener('click', ()=>{
    const link = el.getAttribute('data-link');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).catch(()=>{});
    el.innerHTML = icon('check',{size:13}) + ' Copiado'; setTimeout(()=>{ el.textContent = 'Copiar enlace'; }, 1500);
  }));
  app.querySelectorAll('[data-action="review-user"]').forEach(el=>el.addEventListener('click', ()=>{
    const us = USERS.find(u=>u.id===el.getAttribute('data-userid'));
    if (us){ us.lastReviewOffset = 0; AUDIT_LOG.push({ offset:0, actor: currentUser().name, action:'revisó el perfil de', target: us.name }); }
    render();
  }));
  app.querySelectorAll('[data-action="change-user-role"]').forEach(el=>el.addEventListener('change', ()=>{
    const us = USERS.find(u=>u.id===el.getAttribute('data-userid'));
    if (us && us.role !== el.value){
      AUDIT_LOG.push({ offset:0, actor: currentUser().name, action:`cambió el rol de ${us.name} a`, target: ROLE_LABELS[el.value] });
      us.role = el.value;
    }
    render();
  }));
  app.querySelectorAll('[data-action="toggle-user-active"]').forEach(el=>el.addEventListener('click', ()=>{
    const us = USERS.find(u=>u.id===el.getAttribute('data-userid'));
    if (us){
      const wasInactive = us.status==='inactivo';
      us.status = wasInactive ? 'activo' : 'inactivo';
      AUDIT_LOG.push({ offset:0, actor: currentUser().name, action: wasInactive?'reactivó el acceso de':'desactivó el acceso de', target: us.name });
    }
    render();
  }));

  // ---- Usuarios y Roles — MODO REAL (Supabase) ----
  app.querySelectorAll('[data-action="reload-users-module"]').forEach(el=>el.addEventListener('click', loadRemoteUsersModule));

  // ---- Crear / invitar usuario vía Edge Function "admin-users" (permite cualquier rol) ----
  app.querySelectorAll('[data-action="user-create-mode"]').forEach(el=>el.addEventListener('click', ()=>{
    state.remote.createMode = el.getAttribute('data-mode');
    state.remote.createError = null; state.remote.createBanner = null;
    render();
  }));

  app.querySelectorAll('[data-action="generate-password"]').forEach(el=>el.addEventListener('click', ()=>{
    const field = el.closest('.field');
    const input = field ? field.querySelector('input[name="password"]') : null;
    if (input) input.value = Math.random().toString(36).slice(-5) + Math.random().toString(36).slice(-5).toUpperCase();
  }));

  app.querySelectorAll('[data-action="create-user-edgefn"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const name = form.name.value.trim();
    const email = form.email.value.trim().toLowerCase();
    const password = form.password.value;
    const role = form.role.value;
    const deptId = (role==='directora'||role==='gerente') ? null : form.deptId.value;
    const cargo = form.cargo.value.trim() || null;
    state.remote.createError = null; state.remote.createBanner = null;
    if (!name){ state.remote.createError = 'Escribe el nombre completo de la persona.'; render(); return; }
    if (!email.endsWith(DOMAIN)){ state.remote.createError = `El correo debe pertenecer al dominio institucional ${DOMAIN}.`; render(); return; }
    if (password.length < 6){ state.remote.createError = 'La contraseña debe tener al menos 6 caracteres.'; render(); return; }
    state.remote.createBusy = true; render();
    try {
      await callAdminUsersFunction('create', { name, email, password, dept_id: deptId, role, cargo });
      state.remote.createBanner = { mode: 'create', name, email, password };
      form.reset();
      state.remote.createBusy = false;
      await loadRemoteUsersModule();
    } catch (err) {
      state.remote.createBusy = false;
      state.remote.createError = err.message;
      render();
    }
  }));

  app.querySelectorAll('[data-action="invite-user-edgefn"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const name = form.name.value.trim();
    const email = form.email.value.trim().toLowerCase();
    const role = form.role.value;
    const deptId = (role==='directora'||role==='gerente') ? null : form.deptId.value;
    const cargo = form.cargo.value.trim() || null;
    state.remote.createError = null; state.remote.createBanner = null;
    if (!name){ state.remote.createError = 'Escribe el nombre completo de la persona.'; render(); return; }
    if (!email.endsWith(DOMAIN)){ state.remote.createError = `El correo debe pertenecer al dominio institucional ${DOMAIN}.`; render(); return; }
    state.remote.createBusy = true; render();
    try {
      await callAdminUsersFunction('invite', { name, email, dept_id: deptId, role, cargo });
      state.remote.createBanner = { mode: 'invite', name, email };
      form.reset();
      state.remote.createBusy = false;
      await loadRemoteUsersModule();
    } catch (err) {
      state.remote.createBusy = false;
      state.remote.createError = err.message;
      render();
    }
  }));

  // ---- Editar nombre/cargo (modal) ----
  app.querySelectorAll('[data-action="open-edit-user"]').forEach(el=>el.addEventListener('click', ()=>{
    state.remote.editUserId = el.getAttribute('data-userid');
    state.remote.editError = null;
    render();
  }));
  app.querySelectorAll('[data-action="close-edit-user-modal"]').forEach(el=>el.addEventListener('click', e=>{
    if (el.classList.contains('modal-overlay') && e.target !== el) return;
    state.remote.editUserId = null; state.remote.editError = null; render();
  }));
  app.querySelectorAll('[data-action="save-edit-user"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const client = getSupabaseClient();
    const userId = form.getAttribute('data-userid');
    const name = form.name.value.trim();
    const cargo = form.cargo.value.trim() || null;
    if (!name){ state.remote.editError = 'El nombre no puede quedar vacío.'; render(); return; }
    state.remote.savingId = userId; render();
    try {
      const { error } = await client.from('profiles').update({ name, cargo }).eq('id', userId);
      if (error) throw error;
      await client.from('audit_log').insert({ actor_id: currentUser().id, action: 'editó los datos de', target: name });
      state.remote.savingId = null;
      state.remote.editUserId = null;
      await loadRemoteUsersModule();
    } catch (err) {
      state.remote.savingId = null;
      state.remote.editError = friendlySupabaseError(err);
      render();
    }
  }));

  // ---- Eliminar cuenta por completo (Edge Function, dos clics para confirmar) ----
  app.querySelectorAll('[data-action="delete-user-real-confirm"]').forEach(el=>el.addEventListener('click', async ()=>{
    const userId = el.getAttribute('data-userid');
    const userName = el.getAttribute('data-username');
    if (state.remote.deleteConfirmId === userId){
      state.remote.savingId = userId; render();
      try {
        await callAdminUsersFunction('delete', { userId, targetName: userName });
        state.remote.deleteConfirmId = null;
        state.remote.savingId = null;
        await loadRemoteUsersModule();
      } catch (err) {
        state.remote.savingId = null;
        state.remote.error = err.message;
        render();
      }
    } else {
      state.remote.deleteConfirmId = userId;
      render();
    }
  }));
  app.querySelectorAll('[data-action="delete-user-real-cancel"]').forEach(el=>el.addEventListener('click', ()=>{
    state.remote.deleteConfirmId = null; render();
  }));

  // ---- Cambiar departamento en vivo ----
  app.querySelectorAll('[data-action="change-user-dept-real"]').forEach(el=>el.addEventListener('change', async ()=>{
    const client = getSupabaseClient();
    const userId = el.getAttribute('data-userid');
    const newDept = el.value;
    const us = (state.remote.users||[]).find(u=>u.id===userId);
    if (!us || us.dept_id === newDept) return;
    state.remote.savingId = userId; render();
    try {
      const { error } = await client.from('profiles').update({ dept_id: newDept }).eq('id', userId);
      if (error) throw error;
      const dd = dept(newDept);
      await client.from('audit_log').insert({ actor_id: currentUser().id, action: `cambió el departamento de ${us.name} a`, target: dd ? dd.name : newDept });
      state.remote.savingId = null;
      await loadRemoteUsersModule();
    } catch (err) {
      state.remote.savingId = null;
      state.remote.error = friendlySupabaseError(err);
      render();
    }
  }));

  app.querySelectorAll('[data-action="review-user-real"]').forEach(el=>el.addEventListener('click', async ()=>{
    const client = getSupabaseClient();
    const userId = el.getAttribute('data-userid');
    const us = (state.remote.users||[]).find(u=>u.id===userId);
    if (!us) return;
    state.remote.savingId = userId; render();
    try {
      const nowIso = new Date().toISOString();
      const { error } = await client.from('profiles').update({ last_review_at: nowIso }).eq('id', userId);
      if (error) throw error;
      await client.from('audit_log').insert({ actor_id: currentUser().id, action: 'revisó el perfil de', target: us.name });
      state.remote.savingId = null;
      await loadRemoteUsersModule();
    } catch (err) {
      state.remote.savingId = null;
      state.remote.error = friendlySupabaseError(err);
      render();
    }
  }));

  app.querySelectorAll('[data-action="change-user-role-real"]').forEach(el=>el.addEventListener('change', async ()=>{
    const client = getSupabaseClient();
    const userId = el.getAttribute('data-userid');
    const newRole = el.value;
    const us = (state.remote.users||[]).find(u=>u.id===userId);
    if (!us || us.role === newRole) return;
    state.remote.savingId = userId; render();
    try {
      const updates = { role: newRole };
      if (newRole==='directora' || newRole==='gerente') updates.dept_id = null; // Dirección/Gerencia ven todos los departamentos
      const { error } = await client.from('profiles').update(updates).eq('id', userId);
      if (error) throw error;
      await client.from('audit_log').insert({ actor_id: currentUser().id, action: `cambió el rol de ${us.name} a`, target: ROLE_LABELS[newRole] || newRole });
      state.remote.savingId = null;
      await loadRemoteUsersModule();
    } catch (err) {
      state.remote.savingId = null;
      state.remote.error = friendlySupabaseError(err);
      render();
    }
  }));

  app.querySelectorAll('[data-action="toggle-user-active-real"]').forEach(el=>el.addEventListener('click', async ()=>{
    const client = getSupabaseClient();
    const userId = el.getAttribute('data-userid');
    const us = (state.remote.users||[]).find(u=>u.id===userId);
    if (!us) return;
    const wasInactive = us.status === 'inactivo';
    state.remote.savingId = userId; render();
    try {
      const { error } = await client.from('profiles').update({ status: wasInactive ? 'activo' : 'inactivo' }).eq('id', userId);
      if (error) throw error;
      await client.from('audit_log').insert({ actor_id: currentUser().id, action: wasInactive?'reactivó el acceso de':'desactivó el acceso de', target: us.name });
      state.remote.savingId = null;
      await loadRemoteUsersModule();
    } catch (err) {
      state.remote.savingId = null;
      state.remote.error = friendlySupabaseError(err);
      render();
    }
  }));

  // Mis tareas
  app.querySelectorAll('[data-action="update-my-task-status"]').forEach(el=>el.addEventListener('change', async ()=>{
    const task = TASKS.find(t=>t.id===el.getAttribute('data-taskid'));
    if (!task) return;
    const newVal = el.value;
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('tasks').update({ status: newVal, updated_at: new Date().toISOString() }).eq('id', task.id);
        if (error) throw error;
        task.status = newVal; render();
      } catch (err) { state.taskError = friendlySupabaseError(err); render(); }
      return;
    }
    task.status = newVal; render();
  }));
  app.querySelectorAll('[data-action="toggle-personal"]').forEach(el=>el.addEventListener('change', async ()=>{
    const idx = parseInt(el.getAttribute('data-idx'),10);
    const item = PERSONAL_CHECKLISTS[currentUser().id][idx];
    const newDone = el.checked;
    if (isRealSession() && item._id){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('personal_checklist_items').update({ done: newDone }).eq('id', item._id);
        if (error) throw error;
        item.done = newDone; render();
      } catch (err) { state.checklistError = friendlySupabaseError(err); el.checked = item.done; render(); }
      return;
    }
    item.done = newDone; render();
  }));
  app.querySelectorAll('[data-action="add-personal-item"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const val = form.item.value.trim();
    if (!val){ showFormError(form, 'Escribe un pendiente antes de agregarlo.'); return; }
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const list = PERSONAL_CHECKLISTS[currentUser().id] || [];
        const { data, error } = await client.from('personal_checklist_items').insert({ user_id: currentUser().id, text: val, done:false, position: list.length }).select().single();
        if (error) throw error;
        (PERSONAL_CHECKLISTS[currentUser().id] = list).push({ t: data.text, done: data.done, _id: data.id });
        render();
      } catch (err) { showFormError(form, friendlySupabaseError(err)); }
      return;
    }
    (PERSONAL_CHECKLISTS[currentUser().id] = PERSONAL_CHECKLISTS[currentUser().id] || []).push({ t: val, done:false });
    render();
  }));
  app.querySelectorAll('[data-action="remove-personal-item"]').forEach(el=>el.addEventListener('click', async ()=>{
    const idx = parseInt(el.getAttribute('data-idx'),10);
    const item = PERSONAL_CHECKLISTS[currentUser().id][idx];
    if (isRealSession() && item._id){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('personal_checklist_items').delete().eq('id', item._id);
        if (error) throw error;
        PERSONAL_CHECKLISTS[currentUser().id].splice(idx,1);
        render();
      } catch (err) { state.checklistError = friendlySupabaseError(err); render(); }
      return;
    }
    PERSONAL_CHECKLISTS[currentUser().id].splice(idx,1);
    render();
  }));
}

function toggleTheme(){
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  render();
}

render();
</script>
</body>
</html>
