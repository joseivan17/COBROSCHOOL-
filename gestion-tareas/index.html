        <div class="form-hint">La cuenta queda activa de inmediato con la contraseña que escribas aquí — compártela con la persona por un medio seguro (no por este panel). Necesita la función "admin-users" desplegada (ver SUPABASE_SETUP.md, Parte 4).</div>
      `}
    </div>` : `<div class="role-banner">Estás viendo el equipo de tu departamento en modo de solo lectura. Únicamente la Directora o el Gerente Operativo pueden crear usuarios o ver el historial completo.</div>`;

  const table = `
    <div class="section-head"><h2>${admin?'Todos los usuarios':'Equipo del departamento'}</h2><span class="hint">${list.length} usuario(s) · datos en vivo desde Supabase</span></div>
    <div class="panel" style="margin-bottom:22px;">
      ${errorBanner}
      <table class="task-list-table">
        <thead><tr><th>Usuario</th><th>Correo institucional</th>${admin?'<th>Departamento</th>':''}<th>Rol / Cargo</th><th>Estado</th><th>Última revisión</th>${admin?'<th>Acciones</th>':''}</tr></thead>
        <tbody>
          ${list.map(us=>{
            const d = dept(us.dept_id);
            const isInactive = us.status==='inactivo';
            const isLeader = us.role==='directora'||us.role==='gerente';
            const isSelf = us.id === currentUser().id;
            const busy = state.remote.savingId === us.id;
            const confirmingDelete = state.remote.deleteConfirmId === us.id;
            return `<tr style="${isInactive?'opacity:0.55;':''}">
              <td><span class="user-row-avatar" style="background:${d?d.color:'#52514e'}">${userInitials(us.name)}</span>${us.name}
                ${admin?`<button class="btn" data-action="open-edit-user" data-userid="${us.id}" title="Editar nombre y cargo" style="padding:2px 6px;margin-left:6px;">${icon('edit',{size:12})}</button>`:''}
              </td>
              <td>${us.email}</td>
              ${admin?`<td>${isLeader ? '<span style="color:var(--text-muted)">Todos</span>' : `<select data-action="change-user-dept-real" data-userid="${us.id}" style="font-size:12px;" ${busy?'disabled':''}>
                    ${DEPARTMENTS.map(dd=>`<option value="${dd.id}" ${us.dept_id===dd.id?'selected':''}>${dd.name}</option>`).join('')}
                  </select>`}</td>`:''}
              <td>${admin ? `<select data-action="change-user-role-real" data-userid="${us.id}" style="font-size:12px;" ${busy||isSelf?'disabled':''}>${roleOptions(us.role)}</select>${us.cargo?` (${us.cargo})`:''}` : `${ROLE_LABELS[us.role]||us.role}${us.cargo?` (${us.cargo})`:''}`}</td>
              <td><span class="badge status-${isInactive?'invitado':us.status}">${isInactive?'Inactivo':(us.status==='activo'?'Activo':'Invitado')}</span></td>
              <td>${us.last_review_at ? fmtDateShort(new Date(us.last_review_at)) : '<span style="color:var(--text-muted)">Sin revisar</span>'}</td>
              ${admin?`<td style="white-space:nowrap;">
                  <button class="btn" data-action="review-user-real" data-userid="${us.id}" title="Marcar revisado" ${busy?'disabled':''}>${icon('checkCircle',{size:13})}</button>
                  <button class="btn" data-action="toggle-user-active-real" data-userid="${us.id}" title="${isInactive?'Reactivar acceso':'Desactivar acceso'}" style="${isInactive?'':'color:var(--critical);border-color:var(--critical);'}" ${busy||isSelf?'disabled':''}>${isInactive?icon('checkCircle',{size:13}):icon('lock',{size:13})}</button>
                  ${!isSelf ? `<button class="btn" data-action="delete-user-real-confirm" data-userid="${us.id}" data-username="${us.name}" title="Eliminar cuenta por completo" style="${confirmingDelete?'background:var(--critical);color:#fff;border-color:var(--critical);':'border-color:var(--critical);color:var(--critical);'}" ${busy?'disabled':''}>${confirmingDelete?icon('alertTriangle',{size:13}):icon('trash',{size:13})}</button>${confirmingDelete?`<button class="btn" data-action="delete-user-real-cancel">Cancelar</button>`:''}` : ''}
                </td>`:''}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;

  const history = admin ? `
    <div class="section-head"><h2>Historial de revisión de usuarios</h2><span class="hint">Auditoría de accesos y cambios de rol — en vivo</span></div>
    <div class="panel">
      <table class="task-list-table">
        <thead><tr><th>Fecha</th><th>Quién</th><th>Acción</th></tr></thead>
        <tbody>
          ${(r.auditLog||[]).map(e=>`<tr>
            <td>${fmtDate(new Date(e.created_at))}</td>
            <td>${e.actor ? e.actor.name : '—'}</td>
            <td>${e.action} <b>${e.target}</b></td>
          </tr>`).join('')}
          ${(!r.auditLog || r.auditLog.length===0) ? '<tr><td colspan="3" style="color:var(--text-muted);">Sin actividad registrada todavía.</td></tr>' : ''}
        </tbody>
      </table>
    </div>` : '';

  return `<div class="section">${pendingInvites}</div><div class="section">${createSection}</div><div class="section">${table}</div><div class="section">${history}</div>`;
}

/* =========================================================
   RENDER: BASE DE DATOS (SUPABASE)
   ========================================================= */
function renderSettings(){
  const sb = state.supabase;
  const statusBanner = (() => {
    if (sb.status === 'checking') return `<div class="invite-link-banner" style="background:var(--surface-2);border-color:var(--border-strong);">${icon('database',{size:15})} Probando conexión…</div>`;
    if (sb.status === 'ok') return `<div class="invite-link-banner">${icon('checkCircle',{size:15})} ${sb.message}</div>`;
    if (sb.status === 'error') return `<div class="invite-error">${icon('alertTriangle',{size:14})} ${sb.message}</div>`;
    return '';
  })();

  return `<div class="section">
    <div class="section-head"><h2>Conectar a Supabase</h2><span class="hint">Solo Dirección / Gerencia Operativa</span></div>
    <div class="panel" style="padding:18px 20px;">
      <div class="form-hint" style="margin:0 0 16px;line-height:1.5;">
        Esta pantalla guarda los datos de conexión de tu proyecto Supabase <b>solo en la memoria de esta sesión del navegador</b> (se pierden al recargar) y verifica que la URL y la clave respondan. Es la base de configuración para la integración real: conectar cada módulo (tareas, checklists, usuarios, adjuntos) a tablas de Supabase con sincronización persistente es un trabajo de desarrollo más amplio, propio de la aplicación de producción — no de esta vista de demostración.
      </div>
      <form data-action="save-supabase" style="display:grid;gap:12px;max-width:520px;">
        <div class="field">
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:5px;">URL del proyecto Supabase</label>
          <input type="text" name="url" placeholder="https://tu-proyecto.supabase.co" value="${sb.url.replace(/"/g,'&quot;')}" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);font-size:13px;">
        </div>
        <div class="field">
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:5px;">Clave pública (anon / publishable key)</label>
          <input type="text" name="anonKey" placeholder="sb_publishable_… o eyJhbGciOi…" value="${sb.anonKey.replace(/"/g,'&quot;')}" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);font-size:13px;font-family:monospace;">
          <div class="form-hint">Usa siempre la clave <b>anon/publishable</b> del proyecto (puede empezar con <code>sb_publishable_</code> en proyectos nuevos, o ser un token largo tipo JWT en proyectos con las claves antiguas). Nunca coloques la <b>service role</b> ni la <b>secret</b> key aquí: al ser una aplicación que corre en el navegador, cualquier clave visible en el código queda expuesta al usuario final.</div>
        </div>
        ${statusBanner}
        <div style="display:flex;gap:8px;">
          <button type="submit" class="btn primary">${icon('database',{size:14})} Guardar y probar conexión</button>
          ${sb.url || sb.anonKey ? `<button type="button" class="btn" data-action="clear-supabase">${icon('x',{size:13})} Quitar configuración</button>` : ''}
        </div>
      </form>
    </div>
  </div>`;
}

/* =========================================================
   RENDER: MIS TAREAS
   ========================================================= */
function renderMyTasks(){
  const u = currentUser();
  const mine = TASKS.filter(t => isTaskMine(t)).map(t=>({...t, due:dueDate(t), over:isOverdue(t)})).sort((a,b)=>a.due-b.due);
  const checklist = PERSONAL_CHECKLISTS[u.id] || (PERSONAL_CHECKLISTS[u.id] = []);
  const clDone = checklist.filter(i=>i.done).length;
  const clPct = checklist.length ? Math.round(clDone/checklist.length*100) : 0;

  const assigned = `
    <div class="section-head"><h2>Tareas asignadas a mí</h2><span class="hint">${mine.length} tarea(s)</span></div>
    <div class="panel">
      ${mine.length===0 ? `<div class="empty-state">${(u.role==='directora'||u.role==='gerente') ? 'No tienes tareas operativas asignadas todavía — puedes asignarte una desde cualquier departamento con "+ Nueva tarea", o usar el Panel General para el seguimiento institucional.' : 'No tienes tareas asignadas por el momento.'}</div>` : `
      <table class="task-list-table">
        <thead><tr><th>Tarea</th><th>Departamento</th><th>Compañeros</th><th>Prioridad</th><th>Vence</th><th>Estado de la tarea</th><th>Mi entrega</th></tr></thead>
        <tbody>
          ${mine.map(t=>{
            const d = dept(t.deptId);
            const list = taskAssigneeList(t);
            const others = list.filter(a=> !((a.userId&&a.userId===u.id)||a.name===u.name));
            const mine2 = myAssigneeEntry(t);
            return `<tr>
              <td style="cursor:pointer;" data-action="open-task-modal" data-taskid="${t.id}">${t.title} ${(TASK_ATTACHMENTS[t.id]||[]).length>0?icon('paperclip',{size:12}):''}</td>
              <td><span class="dept-color-dot" style="background:${d.color};display:inline-block;margin-right:6px;"></span>${d.name}</td>
              <td style="color:var(--text-muted);font-size:12px;">${others.length ? others.map(a=>a.name).join(', ') : '—'}</td>
              <td><span class="badge priority-${t.priority}">${PRIORITY_LABELS[t.priority]}</span></td>
              <td style="${t.over?'color:var(--critical);font-weight:700;':''}">${fmtDateShort(t.due)}${t.over?' · vencida':''}</td>
              <td><select data-action="update-my-task-status" data-taskid="${t.id}">
                ${STATUS_ORDER.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
              </select></td>
              <td>${mine2 ? `<span class="deliver-badge ${mine2.status}" data-action="toggle-assignee-status" data-taskid="${t.id}" data-userid="${mine2.userId||mine2.name}" style="cursor:pointer;" title="Clic para cambiar">${mine2.status==='completado'?icon('check',{size:10})+' Entregado':'Marcar entregado'}</span>` : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>`;

  const personal = `
    <div class="section-head"><h2>Mi checklist personal</h2><span class="hint">Privado — solo lo ves tú</span></div>
    <div class="checklist-card panel">
      <div class="checklist-head"><span class="title">${icon('clipboard',{size:15})} Pendientes personales</span><span class="pct" style="color:${semaphoreColor(clPct)}">${checklist.length? clPct+'%' : '—'}</span></div>
      ${state.checklistError ? `<div class="invite-error" style="margin-bottom:8px;">${icon('alertTriangle',{size:14})} ${state.checklistError}</div>` : ''}
      ${checklist.length>0 ? `<div class="progress-track" style="margin-bottom:10px;"><div class="progress-fill" style="width:${clPct}%;background:${semaphoreColor(clPct)}"></div></div>` : ''}
      ${renderChecklistItems(checklist, 'personal', 'Aún no agregas pendientes personales.')}
      <form class="checklist-add-row" data-action="add-personal-item">
        <input type="text" name="item" placeholder="Agregar un pendiente personal…" required>
        <button type="submit" class="btn">+ Agregar</button>
      </form>
    </div>`;

  return `<div class="section">${assigned}</div><div class="section">${personal}</div>`;
}

/* =========================================================
   EVENTOS
   ========================================================= */
function bindEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-action="open-dashboard"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='dashboard'; render();
    if (isRealSession() && !state.remoteTasks.loaded && !state.remoteTasks.loading) loadRemoteTasksModule();
  }));
  app.querySelectorAll('[data-action="open-calendar"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='calendar'; state.calSelected=null; render();
    if (isRealSession() && !state.remoteTasks.loaded && !state.remoteTasks.loading) loadRemoteTasksModule();
  }));
  app.querySelectorAll('[data-action="open-dept"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='department'; state.deptId=el.getAttribute('data-dept'); state.deptSubview='kanban';
    state.filters={resp:'all',status:'all',priority:'all'}; state.checklistError=null;
    state.taskSearch=''; state.checklistSearch.dept=''; state.checklistEdit=null;
    state.selectedTaskIds=new Set(); state.bulkMenuOpen=null; state.templateError=null; state.templateBanner=null; closeAssigneePicker();
    render();
    if (isRealSession() && !state.remoteTasks.loaded && !state.remoteTasks.loading) loadRemoteTasksModule();
  }));
  app.querySelectorAll('[data-action="reload-tasks-module"]').forEach(el=>el.addEventListener('click', loadRemoteTasksModule));
  app.querySelectorAll('[data-action="dept-subview"]').forEach(el=>el.addEventListener('click',()=>{
    state.deptSubview=el.getAttribute('data-sub'); state.selectedTaskIds=new Set(); state.bulkMenuOpen=null; closeAssigneePicker(); render();
  }));
  app.querySelectorAll('[data-action="filter"]').forEach(el=>el.addEventListener('change',()=>{
    state.filters[el.getAttribute('data-filter')] = el.value; render();
  }));
  app.querySelectorAll('[data-action="toggle-checklist"]').forEach(el=>el.addEventListener('change', async ()=>{
    const idx = parseInt(el.getAttribute('data-idx'),10);
    const item = CHECKLISTS[state.deptId].items[idx];
    const newDone = el.checked;
    if (isRealSession() && item._id){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('dept_checklist_items').update({ done: newDone }).eq('id', item._id);
        if (error) throw error;
        item.done = newDone;
        render();
      } catch (err) { state.checklistError = friendlySupabaseError(err); el.checked = item.done; render(); }
      return;
    }
    item.done = newDone;
    render();
  }));
  app.querySelectorAll('[data-action="remove-checklist-item"]').forEach(el=>el.addEventListener('click', async ()=>{
    const idx = parseInt(el.getAttribute('data-idx'),10);
    const item = CHECKLISTS[state.deptId].items[idx];
    if (isRealSession() && item._id){
      const client = getSupabaseClient();
      try {
        const { error } = await client.from('dept_checklist_items').delete().eq('id', item._id);
        if (error) throw error;
        CHECKLISTS[state.deptId].items.splice(idx,1);
        render();
      } catch (err) { state.checklistError = friendlySupabaseError(err); render(); }
      return;
    }
    CHECKLISTS[state.deptId].items.splice(idx,1);
    render();
  }));
  app.querySelectorAll('[data-action="add-checklist-item"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const text = form.item.value.trim();
    if (!text){ showFormError(form, 'Escribe un elemento antes de agregarlo.'); return; }
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const position = CHECKLISTS[state.deptId].items.length;
        const { data, error } = await client.from('dept_checklist_items').insert({ dept_id: state.deptId, text, done:false, position }).select().single();
        if (error) throw error;
        CHECKLISTS[state.deptId].items.push({ t: data.text, done: data.done, _id: data.id });
        render();
      } catch (err) { showFormError(form, friendlySupabaseError(err)); }
      return;
    }
    CHECKLISTS[state.deptId].items.push({ t: text, done: false });
    render();
  }));

  // ---- Búsqueda en checklists ----
  app.querySelectorAll('[data-action="checklist-search"]').forEach(el=>el.addEventListener('input', ()=>{
    const scope = el.getAttribute('data-scope');
    const pos = el.selectionStart;
    state.checklistSearch[scope] = el.value;
    render();
    const el2 = document.getElementById('checklist-search-'+scope);
    if (el2){ el2.focus(); try { el2.setSelectionRange(pos,pos); } catch(e){} }
  }));
  app.querySelectorAll('[data-action="checklist-search-clear"]').forEach(el=>el.addEventListener('click', ()=>{
    const scope = el.getAttribute('data-scope');
    state.checklistSearch[scope] = '';
    render();
    const el2 = document.getElementById('checklist-search-'+scope); if (el2) el2.focus();
  }));
  // ---- Búsqueda en lista de tareas ----
  app.querySelectorAll('[data-action="task-search"]').forEach(el=>el.addEventListener('input', ()=>{
    const pos = el.selectionStart;
    state.taskSearch = el.value;
    render();
    const el2 = document.getElementById('task-search-input');
    if (el2){ el2.focus(); try { el2.setSelectionRange(pos,pos); } catch(e){} }
  }));
  app.querySelectorAll('[data-action="task-search-clear"]').forEach(el=>el.addEventListener('click', ()=>{
    state.taskSearch = '';
    render();
    const el2 = document.getElementById('task-search-input'); if (el2) el2.focus();
  }));
  // ---- Edición de elementos de checklist ----
  app.querySelectorAll('[data-action="edit-checklist-item"]').forEach(el=>el.addEventListener('click', ()=>{
    state.checklistEdit = { scope: el.getAttribute('data-scope'), idx: parseInt(el.getAttribute('data-idx'),10) };
    state.checklistError = null;
    render();
    const inp = document.getElementById('checklist-edit-input');
    if (inp){ inp.focus(); try { inp.select(); } catch(e){} }
  }));
  app.querySelectorAll('[data-action="cancel-checklist-edit"]').forEach(el=>el.addEventListener('click', ()=>{
    state.checklistEdit = null; render();
  }));
  app.querySelectorAll('.checklist-edit-row input').forEach(inp=>inp.addEventListener('keydown', e=>{
    if (e.key==='Escape'){ e.preventDefault(); state.checklistEdit = null; render(); }
  }));
  app.querySelectorAll('[data-action="save-checklist-edit"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const scope = form.getAttribute('data-scope');
    const idx = parseInt(form.getAttribute('data-idx'),10);
    const list = scope==='dept' ? CHECKLISTS[state.deptId].items : (PERSONAL_CHECKLISTS[currentUser().id] || []);
    const item = list[idx];
    const text = form.item.value.trim();
    if (!item){ state.checklistEdit = null; render(); return; }
    if (!text){ showFormError(form, 'El texto no puede quedar vacío.'); return; }
    if (text === item.t){ state.checklistEdit = null; render(); return; }
    if (isRealSession() && item._id){
      const client = getSupabaseClient();
      const table = scope==='dept' ? 'dept_checklist_items' : 'personal_checklist_items';
      try {
        const { error } = await client.from(table).update({ text }).eq('id', item._id);
        if (error) throw error;
        item.t = text; state.checklistEdit = null; state.checklistError = null; render();
      } catch (err) { showFormError(form, friendlySupabaseError(err)); }
      return;
    }
    item.t = text; state.checklistEdit = null; render();
  }));
  // ---- Mostrar / ocultar contraseña ----
  app.querySelectorAll('[data-action="toggle-password"]').forEach(el=>el.addEventListener('click', ()=> togglePasswordField(el)));
  app.querySelectorAll('[data-action="toggle-theme"]').forEach(el=>el.addEventListener('click', toggleTheme));

  // Calendar nav
  app.querySelectorAll('[data-action="cal-prev"]').forEach(el=>el.addEventListener('click',()=>{
    state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()-1, 1); render();
  }));
  app.querySelectorAll('[data-action="cal-next"]').forEach(el=>el.addEventListener('click',()=>{
    state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+1, 1); render();
  }));
  app.querySelectorAll('[data-action="cal-today"]').forEach(el=>el.addEventListener('click',()=>{
    const d = today(); state.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); state.calSelected = d; render();
  }));
  app.querySelectorAll('[data-action="cal-select"]').forEach(el=>el.addEventListener('click',()=>{
    state.calSelected = new Date(el.getAttribute('data-date')); render();
  }));

  // Drag & drop (Kanban)
  app.querySelectorAll('.task-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', card.getAttribute('data-taskid')); e.dataTransfer.effectAllowed='move'; });

    e.preventDefault();
    // Acepta tanto la URL base del proyecto como la URL completa del endpoint REST
    // (algunos paneles de Supabase muestran "https://xxx.supabase.co/rest/v1" directamente) —
    // se normaliza quitando /rest/v1 al final para no duplicarlo después.
    const url = form.url.value.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');
    const anonKey = form.anonKey.value.trim();
    if (!url || !anonKey){
      showFormError(form, 'Completa la URL del proyecto y la clave pública antes de probar la conexión.');
      return;
    }
    state.supabase = { url, anonKey, status:'checking', message:'' };
    render();
    try {
      const resp = await fetch(url + '/rest/v1/', { headers: { apikey: anonKey, Authorization: 'Bearer ' + anonKey } });
      // El endpoint raíz de PostgREST responde 200 con el esquema OpenAPI cuando la clave es válida.
      // Un 404 aquí normalmente indica una URL de proyecto incorrecta, no una conexión exitosa.
      if (resp.ok) {
        state.supabase = { url, anonKey, status:'ok', message:'Conexión exitosa: el proyecto respondió correctamente y aceptó la clave. (Los módulos de esta demo siguen usando datos en memoria; conectar cada tabla es el siguiente paso de desarrollo.)' };
      } else if (resp.status === 401 || resp.status === 403) {
        state.supabase = { url, anonKey, status:'error', message:'El proyecto respondió pero rechazó la clave (' + resp.status + '). Verifica que sea la clave anon/publishable correcta y que no esté revocada.' };

      } else {
        state.supabase = { url, anonKey, status:'error', message:'El proyecto respondió con un estado inesperado (' + resp.status + ').' };
      }
    } catch (err) {
      state.supabase = { url, anonKey, status:'error', message:'No se pudo contactar la URL indicada. Revisa que sea correcta y que tu conexión a internet esté disponible.' };

          due_date: dueVal, resp_user_id: primary ? primary.id : null, assigned_by_user_id: currentUser().id,
        }).select().single();
        if (error) throw error;
        if (respUsers.length) { const { error: aErr } = await client.from('task_assignees').insert(respUsers.map(u=>({ task_id: newTask.id, user_id: u.id }))); if (aErr) throw aErr; }
        if (noteVal) await client.from('task_notes').insert({ task_id: newTask.id, author_id: currentUser().id, text: noteVal });
        TASKS.push({
          id: newTask.id, deptId, title: titleVal, priority: newTask.priority, status: newTask.status,
          dueOffset: 0, dueDateFixed: newTask.due_date,
          resp: primary ? primary.name : '—', cargo: primary ? (primary.cargo||null) : null,
          assignedBy: currentUser().name, _respUserId: newTask.resp_user_id, _assignedByUserId: newTask.assigned_by_user_id, _remote:true,
          notify: false,
          assignees: respUsers.map(u=>({ userId: u.id, name: u.name, cargo: u.cargo||null, status: 'pendiente' })),
        });
        if (noteVal) TASK_NOTES[newTask.id] = [{ author: currentUser().name, offset:0, text: noteVal, _remote:true }];
        state.newTaskDeptId = null;
        state.newTaskAssignees = { search:'', checked:new Set() };
        render();
      } catch (err) {
        if (submitBtn) submitBtn.disabled = false;
        showFormError(form, friendlySupabaseError(err));
      }
      return;
    }
    const id = newTaskId();
    TASKS.push({
      id, deptId, title: titleVal, priority: form.priority.value, status: form.status.value,
      dueOffset: 0, dueDateFixed: dueVal,
      resp: primary ? primary.name : '—', cargo: primary ? (primary.cargo || null) : null,
      assignedBy: currentUser().name, notify: false,
      assignees: respUsers.map(u=>({ userId: u.id, name: u.name, cargo: u.cargo||null, status: 'pendiente' })),
    });
    if (noteVal) TASK_NOTES[id] = [{ author: currentUser().name, offset:0, text: noteVal }];
    state.newTaskDeptId = null;
    state.newTaskAssignees = { search:'', checked:new Set() };

  app.querySelectorAll('[data-action="new-task-ai-assign"]').forEach(el=>el.addEventListener('click', ()=>{

  app.querySelectorAll('[data-action="add-drive-link"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();
    const taskId = form.getAttribute('data-taskid');
    const url = form.driveUrl.value.trim();
    if (!url) return;
    state.attachError = null;
    const name = url.length>60 ? url.slice(0,60)+'…' : url;
    if (isRealSession()){
      const client = getSupabaseClient();
      try {
        const { data, error } = await client.from('task_attachments').insert({ task_id: taskId, type:'link', name, url, uploaded_by: currentUser().id }).select().single();
        if (error) throw error;
        (TASK_ATTACHMENTS[taskId] = TASK_ATTACHMENTS[taskId] || []).push({ type:'link', name, url, _id: data.id, _remote:true });
        render();
      } catch (err) { state.attachError = friendlySupabaseError(err); render(); }
      return;
    }
    (TASK_ATTACHMENTS[taskId] = TASK_ATTACHMENTS[taskId] || []).push({ type:'link', name, url });
    render();
  }));
  app.querySelectorAll('[data-action="add-file-attachment"]').forEach(el=>el.addEventListener('change', async ()=>{
    const file = el.files[0]; if (!file) return;
    const taskId = el.getAttribute('data-taskid');
    const MAX_SIZE = 20 * 1024 * 1024;
    if (file.size > MAX_SIZE){
      state.attachError = `"${file.name}" pesa más de 20 MB — no se puede adjuntar. Comparte un enlace en su lugar.`;
      el.value = '';
      render();
      return;
    }
    if (isRealSession()){
      const task = TASKS.find(t=>t.id===taskId);
      const deptId = task ? task.deptId : state.deptId;
      const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
      const path = `${deptId}/${taskId}/${Date.now()}_${safeName}`;
      const type = attachmentTypeForFile(file);
      state.attachError = null; state.attachUploading = true; render();
      try {
        const client = getSupabaseClient();
        const { error: upErr } = await client.storage.from('task-attachments').upload(path, file, { upsert: false, contentType: file.type || undefined });
        if (upErr) throw upErr;
        const { data: signed, error: signErr } = await client.storage.from('task-attachments').createSignedUrl(path, 60*60*6);
        if (signErr) throw signErr;
        const { data: row, error: insErr } = await client.from('task_attachments').insert({
          task_id: taskId, type, name: file.name, url: signed.signedUrl, storage_path: path, uploaded_by: currentUser().id,
        }).select().single();
        if (insErr) throw insErr;
        (TASK_ATTACHMENTS[taskId] = TASK_ATTACHMENTS[taskId] || []).push({ type, name: file.name, url: signed.signedUrl, _id: row.id, _storagePath: path, _remote: true });
        state.attachUploading = false;
        el.value = '';
        render();
      } catch (err) {
        state.attachUploading = false;
        state.attachError = friendlySupabaseError(err);
        el.value = '';
        render();
      }
      return;
    }
    state.attachError = null;
    const url = URL.createObjectURL(file);
    const type = attachmentTypeForFile(file);
    (TASK_ATTACHMENTS[taskId] = TASK_ATTACHMENTS[taskId] || []).push({ type, name: file.name, url });
    render();
  }));
  app.querySelectorAll('[data-action="remove-attachment"]').forEach(el=>el.addEventListener('click', async ()=>{
    const taskId = el.getAttribute('data-taskid'); const idx = parseInt(el.getAttribute('data-idx'),10);
    const att = (TASK_ATTACHMENTS[taskId]||[])[idx];
    if (!att) return;
    if (isRealSession() && att._id){
      const client = getSupabaseClient();
      try {
        if (att._storagePath){
          const { error: rmErr } = await client.storage.from('task-attachments').remove([att._storagePath]);
          if (rmErr) throw rmErr;
        }
        const { error } = await client.from('task_attachments').delete().eq('id', att._id);
        if (error) throw error;
        TASK_ATTACHMENTS[taskId].splice(idx,1);
        render();
      } catch (err) { state.attachError = friendlySupabaseError(err); render(); }
      return;

  app.querySelectorAll('[data-action="create-user-edgefn"]').forEach(form=>form.addEventListener('submit', async e=>{

      await loadRemoteUsersModule();

      state.remote.createBusy = false;
      state.remote.createError = err.message;
      render();

  // ---- Editar nombre/cargo (modal) ----
  app.querySelectorAll('[data-action="open-edit-user"]').forEach(el=>el.addEventListener('click', ()=>{

  app.querySelectorAll('[data-action="close-edit-user-modal"]').forEach(el=>el.addEventListener('click', e=>{

  }));
  app.querySelectorAll('[data-action="save-edit-user"]').forEach(form=>form.addEventListener('submit', async e=>{
    e.preventDefault();

function toggleTheme(){
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  render();
}

/* =========================================================
   DETECCIÓN DEL ENLACE DE "RESTABLECER CONTRASEÑA"
   ---------------------------------------------------------
   Cuando alguien hace clic en el enlace que llega por correo, Supabase
   redirige de vuelta a esta misma página con datos de sesión temporal en
   la URL y dispara el evento "PASSWORD_RECOVERY". Lo escuchamos para
   mostrar la pantalla de "elige tu nueva contraseña" en vez del login
   normal — sin esto, la persona llegaría aquí y no vería ninguna forma
   de completar el restablecimiento.
   ========================================================= */
(function initAuthRecoveryListener(){
  const client = getSupabaseClient();
  if (!client) return;
  try {
    client.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        state.recoveryMode = true;
        state.authed = false; // por si ya había una sesión previa en memoria, prioriza el restablecimiento
        render();
      }
    });
  } catch (e) { /* si el cliente aún no está listo, simplemente no se detecta el enlace */ }
})();

render();
